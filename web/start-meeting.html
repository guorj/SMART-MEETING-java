<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建会议 - 吉青会务类型</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 560px; margin: 0 auto; padding: 20px; background: #f5f5f5; color: #222; }
        h1 { font-size: 1.25rem; margin-bottom: 8px; }
        .sub { color: #666; font-size: 13px; margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin: 12px 0 6px; }
        select, input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
        .preview { background: #fff; border-radius: 10px; padding: 14px; margin-top: 16px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
        button { margin-top: 18px; width: 100%; padding: 12px; border: none; border-radius: 8px; background: #1976d2; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        .ok { color: #2e7d32; margin-top: 12px; font-size: 14px; }
        .err { color: #c62828; margin-top: 12px; font-size: 14px; }
        a { color: #1976d2; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>创建会议</h1>
    <p class="sub" id="intro">与飞书「开始会议」一致：前 5 类为吉青汽车科技集团固定会务；第 6 类为其他会议，需填写主题。数据来源：<code>GET /api/v1/meeting-type-presets</code></p>

    <div id="feishuBanner" class="sub hidden">已从飞书入口带入会话，请直接选择类型并创建；无需填写 open_id / chat_id。</div>

    <div id="manualIds">
        <label for="creatorId">发起人 creatorId（飞书 open_id，测试可填任意字符串）</label>
        <input id="creatorId" placeholder="ou_xxx" value="ou_test_creator">

        <label for="chatId">群 chat_id（测试可填任意字符串）</label>
        <input id="chatId" placeholder="oc_xxx" value="oc_test_chat">
    </div>

    <label for="preset">会议类型</label>
    <select id="preset"></select>

    <label for="customTitle">会议主题（选「其他会议」时必填）</label>
    <input id="customTitle" placeholder="例如：季度经营复盘">

    <div class="preview" id="preview">请选择类型…</div>

    <button type="button" id="btn" onclick="submitCreate()">创建并返回会议 ID</button>
    <div id="msg"></div>
    <p class="sub" style="margin-top:24px">飞书入口提交后将打开 <code>/rec/会议ID?token=…&amp;autostart=1</code>；群内为「会议已开始」通知（无「开始录音」按钮）。</p>

    <script>
    let presets = [];
    const apiBase = '';
    const params = new URLSearchParams(location.search);
    const webEntryToken = params.get('token');

    async function loadPresets() {
        const r = await fetch(apiBase + '/api/v1/meeting-type-presets');
        const j = await r.json();
        if (j.code !== 0) throw new Error(j.message || '加载失败');
        presets = j.data;
        const sel = document.getElementById('preset');
        sel.innerHTML = '';
        for (const p of presets) {
            const o = document.createElement('option');
            o.value = p.code;
            o.textContent = p.code + ' — ' + p.displayName;
            sel.appendChild(o);
        }
        sel.onchange = updatePreview;
        updatePreview();
    }

    function updatePreview() {
        const code = parseInt(document.getElementById('preset').value, 10);
        const p = presets.find(x => x.code === code);
        if (!p) return;
        let t = '类型：' + p.displayName + '\n集团：' + (p.company || '') + '\n会议组：' + (p.groupName || '');
        if (p.scheduleNote) t += '\n召开时间：' + p.scheduleNote;
        if (p.agendaSummary) t += '\n会议内容：' + p.agendaSummary;
        if (p.organizerName) t += '\n组织人：' + p.organizerName;
        if (p.leaderName) t += '\n会议主导：' + p.leaderName;
        if (p.participantNames && p.participantNames.length) t += '\n与会人员：' + p.participantNames.join('、');
        document.getElementById('preview').textContent = t;
    }

    async function submitCreate() {
        const msg = document.getElementById('msg');
        msg.textContent = '';
        const code = parseInt(document.getElementById('preset').value, 10);
        const customTitle = document.getElementById('customTitle').value.trim();
        if (code === 6 && !customTitle) {
            msg.className = 'err';
            msg.textContent = '选择「其他会议」时请填写会议主题';
            return;
        }
        const body = { presetTypeCode: code };
        if (code === 6) body.title = customTitle;

        let url = apiBase + '/api/v1/meetings';
        const headers = { 'Content-Type': 'application/json' };
        if (webEntryToken) {
            url = apiBase + '/api/v1/meetings/feishu-web/create-and-start';
            headers['X-Feishu-Web-Entry-Token'] = webEntryToken;
        } else {
            const creatorId = document.getElementById('creatorId').value.trim();
            const chatId = document.getElementById('chatId').value.trim();
            if (!creatorId || !chatId) {
                msg.className = 'err';
                msg.textContent = '请填写 creatorId 与 chatId';
                return;
            }
            body.creatorId = creatorId;
            body.chatId = chatId;
        }

        document.getElementById('btn').disabled = true;
        try {
            const r = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
            const j = await r.json();
            if (j.code !== 0) throw new Error(j.message || '创建失败');
            if (webEntryToken && j.data && j.data.recordingUrl) {
                let ru = j.data.recordingUrl;
                ru += (ru.indexOf('?') >= 0 ? '&' : '?') + 'autostart=1';
                window.location.href = ru;
                return;
            }
            msg.className = 'ok';
            msg.textContent = '已创建会议 ID：' + j.data.id + '，主题：' + j.data.title + '（状态：' + j.data.status + '）';
        } catch (e) {
            msg.className = 'err';
            msg.textContent = String(e.message || e);
        } finally {
            document.getElementById('btn').disabled = false;
        }
    }

    if (webEntryToken) {
        document.getElementById('manualIds').classList.add('hidden');
        document.getElementById('feishuBanner').classList.remove('hidden');
        document.getElementById('intro').textContent = '飞书入口：提交后将跳转录音页并开始拾音，同时向本群推送「会议已开始」通知（无需在飞书点「开始录音」）。';
        document.getElementById('btn').textContent = '创建会议并进入录音';
    }

    loadPresets().catch(e => {
        document.getElementById('msg').className = 'err';
        document.getElementById('msg').textContent = '加载预设失败：' + e;
    });
    </script>
</body>
</html>
