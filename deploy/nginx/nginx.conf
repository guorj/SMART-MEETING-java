# 示例：吉青 OA + meeting-server 同域（oa.qdyhjz.cn）
# meeting-server 使用 context-path=/meeting-server，Nginx 须保留 URI 前缀（勿 proxy_pass ...8765/ 剥前缀）

server {
    listen 443 ssl http2;
    server_name oa.qdyhjz.cn;

    ssl_certificate     /etc/letsencrypt/live/oa.qdyhjz.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oa.qdyhjz.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # 吉青 OA 前台
    location / {
        root /datafiles/jqoa/admin-ui;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 吉青 OA 后端（与 meeting-server API 分离）
    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # meeting-server（页面 + API + WS，保留 /meeting-server 前缀）
    location /meeting-server/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # feishu-scheduled-bot（保留 /scheduled-bot 前缀；bot prod 已设 server.servlet.context-path=/scheduled-bot）
    # proxy_pass 无尾斜杠 → 完整 URI 转发，例如 /scheduled-bot/api/admin/reload-schedule
    location /scheduled-bot/ {
        proxy_pass http://127.0.0.1:8764;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}

# 飞书开放平台（须 HTTPS）：
#   事件订阅: https://oa.qdyhjz.cn/meeting-server/api/v1/feishu/webhook
#   卡片回调: https://oa.qdyhjz.cn/meeting-server/api/v1/feishu/callback
# meeting.base-url: https://oa.qdyhjz.cn/meeting-server
# MEETING_NOTIFY_BOT_URL: https://oa.qdyhjz.cn/scheduled-bot（勿加 /api 后缀）
