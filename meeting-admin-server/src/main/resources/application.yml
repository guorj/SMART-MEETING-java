# =============================================================================
# meeting-admin-server 管理后台默认配置
# =============================================================================
# 端口默认 8766，与 meeting-server（8765）分离部署
# 职责：会务预设/会序资料配置、本地上传资料、内部运维页面
#
# 与 meeting-server 共享：
#   - 同一 MySQL intelligence 库（读写预设表、会议表等）
#   - meeting.agenda-material.storage-dir（本地上传资料目录须一致，否则主持页无法下载）
#
# 生效顺序：环境变量 > application-{profile}.yml > 本文件
# =============================================================================

# -----------------------------------------------------------------------------
# HTTP 服务
# -----------------------------------------------------------------------------
server:
  # 管理后台监听端口
  port: ${ADMIN_SERVER_PORT:8766}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# -----------------------------------------------------------------------------
# Spring 与数据源
# -----------------------------------------------------------------------------
spring:
  servlet:
    multipart:
      # 会序资料上传（图片/docx）单请求上限；须 ≥ meeting.agenda-material.max-*-bytes
      max-file-size: 25MB
      max-request-size: 25MB
  application:
    name: meeting-admin-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # 与 meeting-server 同库；管理端主要操作 int_meeting_type_preset 等配置表
    url: jdbc:mysql://${DB_HOST:60.205.1.17}:${DB_PORT:3306}/intelligence?allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&useSSL=false&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:intelligence}
    password: ${DB_PASSWORD:intelligence@2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 禁止启动时灌库，避免覆盖生产数据
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# =============================================================================
# 业务配置 meeting.*
# =============================================================================
meeting:

  # ----- 会序本地上传资料存储（与 meeting-server 必须同路径）-----
  agenda-material:
    # 上传文件落盘根目录；meeting-server GET /agenda-materials/{fileId} 从此读取
    storage-dir: ${AGENDA_MATERIAL_DIR:./data/agenda-materials}
    # 单张图片最大字节（默认 10MB）
    max-image-bytes: ${AGENDA_MATERIAL_MAX_IMAGE_BYTES:10485760}
    # 单个 doc/docx 最大字节（默认 20MB）
    max-doc-bytes: ${AGENDA_MATERIAL_MAX_DOC_BYTES:20971520}

  admin:
    # 管理后台总开关；false 时拒绝 /admin/** 业务 API
    enabled: ${MEETING_ADMIN_ENABLED:true}
    # 简单 Bearer Token，请求头 Authorization: Bearer {token}
    token: ${ADMIN_TOKEN:dev-admin-token}
    # 左侧菜单模块列表（静态页 modules/*.js）
    modules:
      - api-reference
      - presets
      - weekly-jobs
      - push-bot
      - users
      - meetings
      - pipeline
      - settings
      - integrations
    agenda-config:
      # 是否允许从 JSON 文件导入预设（替代纯 DB 编辑）
      file-enabled: ${MEETING_ADMIN_AGENDA_FILE_ENABLED:false}
      file-path: ${MEETING_ADMIN_AGENDA_FILE_PATH:classpath:agenda-templates/example-presets.json}

  # ----- 调用运行时与其它服务的基址 -----
  runtime:
    # meeting-server 根 URL（触发内部刷新、代理部分 API）
    meeting-server-base-url: ${MEETING_SERVER_URL:http://127.0.0.1:8765/meeting-server}
    # feishu-scheduled-bot 推送服务
    bot-base-url: ${MEETING_NOTIFY_BOT_URL:http://127.0.0.1:8764}
    scheduled-bot-apikey: ${SCHEDULED_BOT_APIKEY:jq_int_meeting_key}
    # 调用 meeting-server /api/v1/internal/* 时的 X-Internal-Token
    internal-reload-token: ${INTERNAL_RELOAD_TOKEN:dev-internal-reload}

  oauth:
    feishu:
      # 管理后台飞书 OAuth 登录（可选）
      enabled: ${MEETING_ADMIN_FEISHU_OAUTH_ENABLED:false}
      app-id: ${FEISHU_APP_ID:}
      app-secret: ${FEISHU_APP_SECRET:}
      redirect-uri: ${MEETING_ADMIN_FEISHU_REDIRECT_URI:http://127.0.0.1:8766/admin/oauth/feishu/callback}
      # 允许登录的飞书 user_id 白名单；空列表表示不限制（需结合业务代码）
      allowed-user-ids: []
      session-ttl-hours: 8
