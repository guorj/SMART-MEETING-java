<!DOCTYPE html>
<html lang="zh-CN">

  <link rel="stylesheet" href="/static/admin/admin.css"/>
</head>
<body>

  <p>Smart Meeting Admin · 端口 8766</p>

<div id="app" class="hidden">
  <aside id="sidebar">
    <div class="sidebar-brand"><strong>会议管理</strong><span>meeting-admin-server</span></div>
    <nav id="sidebar-nav"></nav>
  </aside>
  <main>
    <header id="top-bar"><span id="route-title"></span></header>
    <div id="module-root"></div>
  </main>
</div>
<script src="/static/admin/admin.js"></script>
</body>
</html>
