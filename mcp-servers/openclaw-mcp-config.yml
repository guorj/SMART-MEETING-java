# OpenClaw Gateway MCP 配置参考
#
# 合并到 profile 配置：instances/<profile>/config/openclaw.json 或
# ~/.openclaw-<profile>/openclaw.json 的 mcp.servers（勿用顶层 mcpServers）。
# 工具全名表：mcp-servers/LARK-MCP-TOOLS.md
#
# 文档：https://documentation.openclaw.ai/gateway/configuration-reference#mcp

mcp:
  servers:
    # -------------------------------------------------------------------------
    # lark-mcp — 飞书开放平台（@larksuiteoapi/lark-mcp）
    # 白名单 -t：读多维表 + weekly-comparison 读/写 Doc + 读 wiki
    #   lark-mcp__bitable_v1_appTableField_list
    #   lark-mcp__bitable_v1_appTableRecord_search
    #   lark-mcp__docx_v1_document_create
    #   lark-mcp__docx_v1_documentBlockChildren_create
    #   lark-mcp__docx_v1_document_rawContent
    #   lark-mcp__wiki_v2_space_getNode
    # -------------------------------------------------------------------------
    lark-mcp:
      command: npx
      args:
        - -y
        - "@larksuiteoapi/lark-mcp"
        - mcp
        - -a
        - ${FEISHU_APP_ID}          # weekly-comparison 应用；与 feishu.weekly-comparison.app-id 一致
        - -s
        - ${FEISHU_APP_SECRET}
        - -t
        # OpenAPI 白名单（逗号分隔，勿用 preset.default，以免带入多余写接口）
        - bitable.v1.appTableField.list,bitable.v1.appTableRecord.search,docx.v1.document.create,docx.v1.documentBlockChildren.create,docx.v1.document.rawContent,wiki.v2.space.getNode
        - --token-mode
        - tenant_access_token       # bot 身份读表/写 Doc
        - -l
        - zh                        # 工具描述中文
        - -c
        - snake                     # 注册名：bitable_v1_* → OpenClaw：lark-mcp__bitable_v1_*

    # -------------------------------------------------------------------------
    # meeting-mysql — @modelcontextprotocol/server-mysql
    # OpenClaw 工具（生产建议 DB 只读账号，Skill 仅放行 query）：
    #   meeting-mysql__query           — 执行 SQL（progress-analysis / minute-enhancement）
    #   meeting-mysql__list_tables     — 列库表（未写入 Skill allowed-tools）
    #   meeting-mysql__describe_table  — 表结构（未写入 Skill allowed-tools）
    #   meeting-mysql__insert          — 写（未放行）
    #   meeting-mysql__update          — 写（未放行）
    # -------------------------------------------------------------------------
    meeting-mysql:
      command: npx
      args:
        - -y
        - "@modelcontextprotocol/server-mysql"
      env:
        # 注意：仅改 feishu-scheduled-bot 的 application.yml 不会影响本 MCP！
        # ${DB_HOST} 由 OpenClaw 在加载 openclaw.json 时替换；未设置则启动报错或子进程落到 localhost。
        # 生产建议直接写死 IP（与 Bot/meeting-server 共库 intelligence 一致）：
        MYSQL_HOST: "60.205.1.17"
        MYSQL_PORT: "3306"
        MYSQL_USER: "intelligence"
        MYSQL_PASSWORD: "intelligence@2026"
        MYSQL_DATABASE: "intelligence"
        # 若坚持用环境变量，须在 openclaw.json 顶层 env.vars 或 Gateway 进程环境中设 DB_HOST 等，且：
        # MYSQL_HOST: ${DB_HOST}
