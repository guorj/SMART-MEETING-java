# =============================================================================
# OpenClaw Gateway MCP 配置参考（非 Spring Boot 配置，勿放入 application.yml）
# =============================================================================
# 用途：纪要 AI 增强、会前对比 Skill 等通过 Gateway 调用飞书/ MySQL 工具
#
# 合并方式：复制 mcp.servers 到
#   instances/<profile>/config/openclaw.json 或 ~/.openclaw-<profile>/openclaw.json
#   （字段名为 mcp.servers，勿用顶层 mcpServers）
#
# 相关文档：
#   mcp-servers/LARK-MCP-TOOLS.md — 工具全名表
#   mcp-servers/WEEKLY-COMPARISON-GATEWAY-CHECKLIST.md — 会前对比部署检查
#   文档：https://documentation.openclaw.ai/gateway/configuration-reference#mcp
# =============================================================================
#
# 【重要】会前对比（weekly-comparison）生产必须：
#   - lark-mcp --token-mode tenant_access_token（下方已写死，勿改 user/oauth）
#   - -a/-s 与 feishu-scheduled-bot feishu.weekly-comparison.app-id/secret 一致
#   - 合并后：openclaw --profile <p> mcp show lark-mcp → 确认 tenant_access_token
#
# 文档：https://documentation.openclaw.ai/gateway/configuration-reference#mcp

mcp:
  servers:
    # -------------------------------------------------------------------------
    # lark-mcp — 飞书开放平台（@larksuiteoapi/lark-mcp）
    # 白名单 -t：读多维表 + weekly-comparison 读/写 Doc + 读 wiki
    #   lark-mcp__bitable_v1_appTableField_list
    #   lark-mcp__bitable_v1_appTableRecord_search
    #   lark-mcp__docx_v1_document_create
    #   lark-mcp__docx_v1_documentBlockChildren_create
    #   lark-mcp__docx_v1_document_rawContent
    #   lark-mcp__wiki_v2_space_getNode
    # -------------------------------------------------------------------------
    lark-mcp:
      command: npx
      args:
        - -y
        - "@larksuiteoapi/lark-mcp"
        - mcp
        - -a
        - ${FEISHU_APP_ID}          # weekly-comparison 应用；与 feishu.weekly-comparison.app-id 一致
        - -s
        - ${FEISHU_APP_SECRET}
        - -t
        # OpenAPI 白名单（逗号分隔，勿用 preset.default，以免带入多余写接口）
        - bitable.v1.appTableField.list,bitable.v1.appTableRecord.search,docx.v1.document.create,docx.v1.documentBlockChildren.create,docx.v1.document.rawContent,wiki.v2.space.getNode
        - --token-mode
        - tenant_access_token       # 会前对比强制租户身份；禁止 user_access_token / --oauth
        - -l
        - zh                        # 工具描述中文
        - -c
        - snake                     # 注册名：bitable_v1_* → OpenClaw：lark-mcp__bitable_v1_*

    # -------------------------------------------------------------------------
    # meeting-mysql — mcp-server-mysql（npm 包名，无 @scope 前缀）
    # 勿用 @modelcontextprotocol/server-mysql（npm 404）。
    # 本包仅暴露 mysql_query（只读 SELECT）；OpenClaw 全名：meeting-mysql__mysql_query
    # -------------------------------------------------------------------------
    meeting-mysql:
      command: npx
      args:
        - -y
        - "mcp-server-mysql"
      env:
        # 注意：仅改 feishu-scheduled-bot 的 application.yml 不会影响本 MCP！
        # 本包使用 MYSQL_PASS / MYSQL_DB（非 MYSQL_PASSWORD / MYSQL_DATABASE）
        # 生产建议直接写死 IP（与 Bot/meeting-server 共库 intelligence 一致）：
        MYSQL_HOST: "60.205.1.17"
        MYSQL_PORT: "3306"
        MYSQL_USER: "intelligence"
        MYSQL_PASS: "intelligence@2026"
        MYSQL_DB: "intelligence"
        # 若坚持用环境变量，须在 openclaw.json 顶层 env.vars 或 Gateway 进程环境中设 DB_HOST 等，且：
        # MYSQL_HOST: ${DB_HOST}
