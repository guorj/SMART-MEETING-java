# OpenClaw Gateway MCP Server 配置参考
#
# 将以下 mcpServers 合并到 ~/.openclaw/openclaw.json 的 mcpServers 字段中。
# 环境变量需在 Gateway 启动前设置（或直接替换为实际值）。

mcpServers:
  # 飞书多维表格 MCP Server（自定义，TypeScript 实现）
  feishu-bitable:
    command: node
    args:
      - /opt/mcp-servers/feishu-bitable/dist/index.js
    transport: stdio
    env:
      FEISHU_APP_ID: ${FEISHU_APP_ID}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET}

  # MySQL MCP Server（官方预构建包，无需自定义代码）
  # 提供工具：query / list_tables / describe_table / insert / update
  # 生产环境建议使用只读 MySQL 账号
  meeting-mysql:
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-mysql"
    transport: stdio
    env:
      MYSQL_HOST: ${DB_HOST}
      MYSQL_PORT: ${DB_PORT}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: intelligence
