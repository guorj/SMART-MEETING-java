<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
    (function(){var p=location.pathname||'';var c=(p==='/meeting-server'||p.startsWith('/meeting-server/'))?'/meeting-server':'';var b=document.createElement('base');b.href=c?c+'/':'/';document.head.appendChild(b);})();
    </script>
    <title>创建会议 - 吉青会务类型</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ui-kit/tokens.css?v=sm-ui-20260610-2">
    <link rel="stylesheet" href="ui-kit/components.css?v=sm-ui-20260610-2">
    <link rel="stylesheet" href="ui-kit/icons.css?v=sm-ui-20260610-2">
    <link rel="stylesheet" href="ui-kit/motion.css?v=sm-ui-20260610-2">
    <script src="ui-kit/icons.js?v=sm-ui-20260610-2"></script>
    <style>
        body { max-width: 560px; margin: 0 auto; padding: 20px; }
        h1 { font-size: 1.25rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .sub { color: var(--color-text-secondary); font-size: 13px; margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin: 12px 0 6px; }
        select, input { width: 100%; padding: 10px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-size: 15px; min-height: var(--touch-min); }
        .preview { background: var(--color-surface); border-radius: var(--radius-md); padding: 14px; margin-top: 16px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; box-shadow: var(--shadow-card); border: 1px solid var(--color-border); }
        #btn { margin-top: 18px; width: 100%; }
        .ok { color: var(--color-success); margin-top: 12px; font-size: 14px; }
        .err { color: var(--color-danger); margin-top: 12px; font-size: 14px; }
        a { color: var(--color-primary); }
    </style>
</head>
<body>
    <h1>创建会议</h1>
    <p class="sub" id="intro">与飞书「开始会议」一致：选择会议模板并创建。</p>
    <details class="ui-help sub"><summary>开发者说明</summary>
      <p>数据来源：<code>GET /api/v1/meeting-type-presets</code></p>
    </details>

    <div id="feishuBanner" class="sub hidden">已从飞书入口带入会话，请直接选择类型并创建；无需填写 user_id / chat_id。</div>

    <div id="manualIds">
        <label for="creatorId">发起人 creatorId（飞书 user_id，测试可填任意字符串）</label>
        <input id="creatorId" placeholder="feishu_user_id_example" value="feishu_user_id_test_creator">

        <label for="chatId">群 chat_id（测试可填任意字符串）</label>
        <input id="chatId" placeholder="oc_xxx" value="oc_test_chat">
    </div>

    <label for="preset">会议类型</label>
    <select id="preset"></select>

    <label for="scheduledTime">计划开始时间（可选，create-only 测试路径）</label>
    <input id="scheduledTime" type="datetime-local">

    <div class="preview" id="preview">请选择类型…</div>

    <button type="button" class="ui-btn ui-btn-primary" id="btn" onclick="submitCreate()">创建并返回会议 ID</button>
    <div id="msg"></div>
    <script>
    if(window.Iconsax){
      var h1=document.querySelector('h1');
      if(h1) h1.insertAdjacentHTML('afterbegin', Iconsax.render('add'));
      var btn=document.getElementById('btn');
      if(btn) btn.insertAdjacentHTML('afterbegin', Iconsax.render('video')+' ');
    }
    </script>
    <p class="sub" style="margin-top:24px">飞书入口提交后将打开录音页 <code>/rec/会议ID?token=…</code>（不自动开始拾音）；群内推送「会议已创建」通知，须在主持页点击「开始会议」后正式进入进行中。</p>

    <script src="static/meeting-context.js?v=sm-20260525-1"></script>
    <script>
    let presets = [];
    const apiBase = meetingContextPath();
    const params = new URLSearchParams(location.search);
    const webEntryToken = params.get('token');

    async function loadPresets() {
        const r = await fetch(apiBase + '/api/v1/meeting-type-presets');
        const j = await r.json();
        if (j.code !== 0) throw new Error(j.message || '加载失败');
        presets = j.data;
        const sel = document.getElementById('preset');
        sel.innerHTML = '';
        for (const p of presets) {
            const o = document.createElement('option');
            o.value = p.code;
            o.textContent = p.code + ' — ' + p.displayName;
            sel.appendChild(o);
        }
        sel.onchange = updatePreview;
        updatePreview();
    }

    function updatePreview() {
        const code = parseInt(document.getElementById('preset').value, 10);
        const p = presets.find(x => x.code === code);
        if (!p) return;
        let t = '类型：' + p.displayName + '\n集团：' + (p.company || '') + '\n会议组：' + (p.groupName || '');
        if (p.scheduleNote) t += '\n召开时间：' + p.scheduleNote;
        if (p.organizerName) t += '\n组织人：' + p.organizerName;
        if (p.leaderName) t += '\n会议主导：' + p.leaderName;
        if (p.participantNames && p.participantNames.length) t += '\n与会人员：' + p.participantNames.join('、');
        document.getElementById('preview').textContent = t;
    }

    async function submitCreate() {
        const msg = document.getElementById('msg');
        msg.textContent = '';
        const code = parseInt(document.getElementById('preset').value, 10);
        const body = { presetTypeCode: code };

        let url = apiBase + '/api/v1/meetings';
        const headers = { 'Content-Type': 'application/json' };
        if (webEntryToken) {
            url = apiBase + '/api/v1/meetings/feishu-web/create-and-start';
            headers['X-Feishu-Web-Entry-Token'] = webEntryToken;
        } else {
            const creatorId = document.getElementById('creatorId').value.trim();
            const chatId = document.getElementById('chatId').value.trim();
            if (!creatorId || !chatId) {
                msg.className = 'err';
                msg.textContent = '请填写 creatorId 与 chatId';
                return;
            }
            body.creatorId = creatorId;
            body.chatId = chatId;
            const stRaw = document.getElementById('scheduledTime').value.trim();
            if (stRaw) {
                body.scheduledTime = stRaw.length === 16 ? stRaw + ':00' : stRaw;
            }
        }

        document.getElementById('btn').disabled = true;
        try {
            const r = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
            const j = await r.json();
            if (j.code !== 0) throw new Error(j.message || '创建失败');
            if (webEntryToken && j.data && j.data.recordingUrl) {
                window.location.href = j.data.recordingUrl;
                return;
            }
            msg.className = 'ok';
            msg.textContent = '已创建会议 ID：' + j.data.id + '，主题：' + j.data.title + '（状态：' + j.data.status + '）';
        } catch (e) {
            msg.className = 'err';
            msg.textContent = String(e.message || e);
        } finally {
            document.getElementById('btn').disabled = false;
        }
    }

    if (webEntryToken) {
        document.getElementById('manualIds').classList.add('hidden');
        document.getElementById('feishuBanner').classList.remove('hidden');
        const stLabel = document.querySelector('label[for="scheduledTime"]');
        if (stLabel) stLabel.style.display = 'none';
        document.getElementById('scheduledTime').style.display = 'none';
        document.getElementById('intro').textContent = '飞书入口：点「开始会议」后将跳转主持/录音页，并向本群推送「会议已创建」通知；进入页面后请点击「开始会议」以授权麦克风并正式开始议程主持。';
        document.getElementById('btn').textContent = '开始会议';
    }

    loadPresets().catch(e => {
        document.getElementById('msg').className = 'err';
        document.getElementById('msg').textContent = '加载预设失败：' + e;
    });
    </script>
</body>
</html>
