<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能会议前台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:#f0f2f5;display:flex;justify-content:center;align-items:flex-start;padding:20px 12px;min-height:100vh}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,0.08);max-width:480px;width:100%;margin-bottom:16px}
.card h2{font-size:18px;font-weight:600;margin-bottom:12px;color:#1a1a1a}
.card h3{font-size:15px;font-weight:600;margin-bottom:8px;color:#333}
.section{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #eee}
.section:last-child{border-bottom:none;margin-bottom:0}
.user-bar{display:flex;align-items:center;justify-content:space-between;padding:12px;background:#f0f7ff;border-radius:8px;margin-bottom:8px}
.user-name{font-size:16px;font-weight:600;color:#1677ff}
.badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:12px;font-weight:500}
.badge-valid{background:#e8f5e9;color:#52c41a}
.badge-expiring{background:#fff7e6;color:#fa8c16}
.badge-expired{background:#fff2f0;color:#ff4d4f}
.badge-none{background:#f5f5f5;color:#999}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.btn{padding:14px 16px;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s}
.btn-primary{background:#1677ff;color:#fff}
.btn-primary:active{background:#0d6efd}
.btn-secondary{background:#f0f2f5;color:#333;border:1px solid #e0e0e0}
.btn-secondary:active{background:#e6e6e6}
.btn-voice{background:#52c41a;color:#fff}
.btn-voice:active{background:#3dae0a}
.btn-recover{background:#fa8c16;color:#fff}
.btn-recover:active{background:#d46b08}
.btn-danger{background:#ff4d4f;color:#fff}
.btn-danger:active{background:#cf1322}
.meeting-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.meeting-item:last-child{border-bottom:none}
.meeting-icon{font-size:16px;width:24px;text-align:center}
.meeting-title{font-size:14px;color:#333;flex:1}
.meeting-time{font-size:12px;color:#999}
.meeting-link{font-size:13px;color:#1677ff;text-decoration:none}
.other-input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-top:10px}
.msg{padding:12px;border-radius:8px;margin-top:12px;font-size:14px}
.msg-ok{background:#f6ffed;color:#52c41a}
.msg-err{background:#fff2f0;color:#ff4d4f}
.msg-info{background:#f0f7ff;color:#1677ff}
.hidden{display:none}
.muted{color:#999;font-size:12px}
.loading{text-align:center;padding:40px;color:#999;font-size:16px}
</style>
</head>
<body>
<div id="app" class="loading">加载中…</div>
<script>
const params=new URLSearchParams(location.search);
const TOKEN=params.get('token')||'';
const BASE=location.pathname.replace(/\/dashboard$/,'');
function withBase(path){
  if(/^https?:\/\//i.test(path)) return path;
  if(path.startsWith('/')) return BASE + path;
  return BASE + '/' + path;
}
if(!TOKEN){document.getElementById('app').innerHTML='<div class="card msg msg-err">缺少访问令牌，请从飞书重新发送「会议管理」</div>';throw new Error('no token');}

async function api(path, options){
  const fullPath=withBase(path);
  const url=fullPath.includes('?')?fullPath+'&token='+TOKEN:fullPath+'?token='+TOKEN;
  const res=await fetch(url, options||{});
  if(!res.ok){const t=await res.text();throw new Error(t||'请求失败');}
  const body=await res.json();
  if(body && typeof body.code==='number'){
    if(body.code!==0){throw new Error(body.message||'请求失败');}
    return body.data;
  }
  return body;
}

function esc(s){return(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function fmtDt(s){return s?String(s).replace('T',' ').slice(0,16):'-';}
function statusIcon(st){
  if(st==='COMPLETED')return '✅';
  if(st==='RECORDING')return '🔴';
  if(st==='STARTED')return '🟢';
  if(st==='PROCESSING')return '⏳';
  return '⏹️';
}
function vpBadge(status){
  if(status==='VALID')return '<span class="badge badge-valid">声纹有效</span>';
  if(status==='EXPIRING')return '<span class="badge badge-expiring">即将过期</span>';
  if(status==='EXPIRED')return '<span class="badge badge-expired">已过期</span>';
  return '<span class="badge badge-none">未注册</span>';
}
function canRecover(st){
  return st==='STARTED'||st==='RECORDING'||st==='PAUSED';
}
function canEnd(st){
  return st==='STARTED'||st==='RECORDING'||st==='PAUSED';
}

async function init(){
  try{
    const me=await api('/api/v1/dashboard/me');
    const vp=await api('/api/v1/dashboard/voiceprint-status');
    const activeMeeting=await api('/api/v1/dashboard/active-meeting');
    const meetings=await api('/api/v1/dashboard/recent-meetings?limit=10');
    const presets=await api('/api/v1/dashboard/meeting-presets');

    const presetButtons=presets.map(p=>`<button class="btn btn-primary" data-code="${p.code}">${esc(p.displayName)}</button>`).join('');
    const meetingList=meetings.length===0?'<p class="muted">暂无近期会议</p>':
      meetings.map(m=>`<div class="meeting-item"><span class="meeting-icon">${statusIcon(m.status)}</span><span class="meeting-title">${esc(m.title)}</span><span class="meeting-time">${fmtDt(m.createdAt)}</span>${m.docUrl?'<a class="meeting-link" href="'+esc(m.docUrl)+'" target="_blank">纪要</a>':''}</div>`).join('');
    const activeHtml=activeMeeting
      ? `<div class="msg msg-info" style="margin-top:0;margin-bottom:10px">
           检测到进行中会议：<b>${esc(activeMeeting.title || activeMeeting.id)}</b>（${esc(activeMeeting.status)}）
         </div>
         <div class="btn-grid" style="margin-top:0">
           <button class="btn btn-recover" id="btn-recover" style="width:100%" ${canRecover(activeMeeting.status)?'':'disabled'}>恢复当前会议</button>
           <button class="btn btn-danger" id="btn-end-active" style="width:100%" ${canEnd(activeMeeting.status)?'':'disabled'}>结束当前会议</button>
         </div>`
      : '';

    document.getElementById('app').innerHTML=`
      <div class="card">
        <div class="user-bar"><span class="user-name">${esc(me.userName||me.feishuUserId)}</span>${vpBadge(vp.expiryStatus)}</div>
        ${me.mappingExists?'<p class="muted">OA userId: '+esc(me.oaUserId)+'</p>':'<p class="muted">未关联 OA 账号</p>'}
      </div>
      <div class="card">
        <h2>开始会议</h2>
        <div class="btn-grid">${presetButtons}</div>
        <input id="other-title" class="other-input" placeholder="输入自定义会议主题…"/>
        <button class="btn btn-secondary" id="btn-other" style="grid-column:1/3;width:100%">创建其他会议</button>
        <p id="create-msg" class="msg hidden"></p>
      </div>
      ${activeMeeting ? `<div class="card">${activeHtml}</div>` : ''}
      <div class="card">
        <h2>声纹管理</h2>
        <p>${vp.registered?'声纹特征 ID: '+esc(vp.featureId)+'<br/>有效期至: '+fmtDt(vp.expiresAt):'您尚未注册声纹，注册后会议纪要可自动识别您的声音。'}</p>
        <button class="btn btn-voice" id="btn-register">${vp.registered?'重新注册声纹':'注册声纹'}</button>
      </div>
      <div class="card">
        <h2>近期会议</h2>
        ${meetingList}
      </div>
      <div class="card">
        <p class="muted">令牌有效期 8 小时 · 过期后请重新发送「会议管理」</p>
      </div>`;

    document.querySelectorAll('[data-code]').forEach(btn=>{
      btn.onclick=async()=>{
        const code=parseInt(btn.dataset.code);
        await doCreateMeeting(code,null);
      };
    });
    document.getElementById('btn-other').onclick=async()=>{
      const title=document.getElementById('other-title').value.trim();
      if(!title){showMsg('create-msg','请输入会议主题',true);return;}
      await doCreateMeeting(6,title);
    };
    document.getElementById('btn-register').onclick=async()=>{
      try{
        const r=await api('/api/v1/dashboard/voiceprint-register-url');
        location.href=r.registerUrl;
      }catch(e){showMsg('create-msg',e.message,true);}
    };
    const recoverBtn=document.getElementById('btn-recover');
    const endBtn=document.getElementById('btn-end-active');
    const setActiveButtonsDisabled=(disabled)=>{
      if(recoverBtn) recoverBtn.disabled=disabled;
      if(endBtn) endBtn.disabled=disabled;
    };
    if(recoverBtn && activeMeeting){
      recoverBtn.onclick=async()=>{
        if(!canRecover(activeMeeting.status)) return;
        setActiveButtonsDisabled(true);
        try{
          const r=await api('/api/v1/dashboard/active-meeting/recover',{method:'POST'});
          if(r && r.recordingUrl){
            window.open(r.recordingUrl,'_blank');
          }else{
            showMsg('create-msg','当前会议暂无可用入口，请稍后重试。',true);
          }
        }catch(e){
          showMsg('create-msg',e.message,true);
        }finally{
          setActiveButtonsDisabled(false);
        }
      };
    }
    if(endBtn && activeMeeting){
      endBtn.onclick=async()=>{
        if(!canEnd(activeMeeting.status)) return;
        if(!confirm('确认结束当前会议？结束后将进入纪要处理流程。')) return;
        setActiveButtonsDisabled(true);
        try{
          await api('/api/v1/dashboard/active-meeting/end',{method:'POST'});
          showMsg('create-msg','当前会议已结束，正在生成纪要。',false);
          setTimeout(()=>init(),1200);
        }catch(e){
          showMsg('create-msg',e.message,true);
          setActiveButtonsDisabled(false);
        }
      };
    }

  }catch(e){
    document.getElementById('app').innerHTML='<div class="card msg msg-err">加载失败: '+esc(e.message)+'</div>';
  }
}

async function doCreateMeeting(presetCode,title){
  const msgEl=document.getElementById('create-msg');
  msgEl.classList.remove('hidden');
  msgEl.className='msg msg-info';
  msgEl.textContent='正在创建会议…';
  try{
    const body={presetTypeCode:presetCode};
    if(title)body.title=title;
    const r=await api('/api/v1/dashboard/create-meeting',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    msgEl.className='msg msg-ok';
    if(r && r.recordingUrl){
      msgEl.innerHTML='会议已创建！ID: '+esc(r.id)+'<br/>'
        +'<a class="meeting-link" href="'+esc(r.recordingUrl)+'" target="_blank">打开会议主页（直达）</a>'
        +'<br/><span class="muted">飞书会话中也会推送直达卡片</span>';
    }else{
      msgEl.textContent='会议已创建！ID: '+r.id;
    }
    setTimeout(()=>{msgEl.classList.add('hidden');init();},3000);
  }catch(e){
    msgEl.className='msg msg-err';
    msgEl.textContent=e.message;
  }
}

function showMsg(id,text,isErr){
  const el=document.getElementById(id);
  el.classList.remove('hidden');
  el.className=isErr?'msg msg-err':'msg msg-ok';
  el.textContent=text;
}

init();
</script>
</body>
</html>
