<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function(){var p=location.pathname||'';var c=(p==='/meeting-server'||p.startsWith('/meeting-server/'))?'/meeting-server':'';var b=document.createElement('base');b.href=c?c+'/':'/';document.head.appendChild(b);})();
</script>
<title>智能会议前台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui-kit/tokens.css?v=sm-ui-20260612-2">
<link rel="stylesheet" href="ui-kit/components.css?v=sm-ui-20260612-2">
<link rel="stylesheet" href="ui-kit/icons.css?v=sm-ui-20260612-2">
<link rel="stylesheet" href="ui-kit/motion.css?v=sm-ui-20260612-2">
<link rel="stylesheet" href="ui-kit/magic-bento.css?v=sm-ui-20260612-2">
<link rel="stylesheet" href="ui-kit/chroma-grid.css?v=sm-ui-20260612-3">
<link rel="stylesheet" href="ui-kit/gooey-nav.css?v=sm-ui-20260612-6">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="ui-kit/icons.js?v=sm-ui-20260610-2"></script>
<script src="ui-kit/motion.js?v=sm-ui-20260610-2"></script>
<script src="ui-kit/magic-bento.js?v=sm-ui-20260611-2"></script>
<script src="ui-kit/chroma-grid.js?v=sm-ui-20260612-3"></script>
<script src="ui-kit/gooey-nav.js?v=sm-ui-20260612-3"></script>
<script>if(!window.Iconsax){window.Iconsax={render:function(){return''},renderModule:function(){return''}};}</script>
</head>
<body class="dashboard-page">
<div id="app" class="loading-skeleton-wrap">
  <div class="ui-card"><div class="ui-skeleton ui-skeleton-block"></div></div>
  <div class="ui-card"><div class="ui-skeleton ui-skeleton-line"></div><div class="ui-skeleton ui-skeleton-line short"></div></div>
  <div class="ui-card"><div class="ui-skeleton ui-skeleton-line"></div><div class="ui-skeleton ui-skeleton-line"></div></div>
</div>
<script>
const params=new URLSearchParams(location.search);
const TOKEN=params.get('token')||'';
const BASE=location.pathname.replace(/\/dashboard$/,'');
function withBase(path){
  if(/^https?:\/\//i.test(path)) return path;
  if(path.startsWith('/')) return BASE + path;
  return BASE + '/' + path;
}
if(!TOKEN){document.getElementById('app').innerHTML='<div class="ui-card msg msg-err">缺少访问令牌，请从飞书重新发送「会议管理」</div>';throw new Error('no token');}

async function api(path, options){
  const fullPath=withBase(path);
  const url=fullPath.includes('?')?fullPath+'&token='+TOKEN:fullPath+'?token='+TOKEN;
  const res=await fetch(url, options||{});
  if(!res.ok){const t=await res.text();throw new Error(t||'请求失败');}
  const body=await res.json();
  if(body && typeof body.code==='number'){
    if(body.code!==0){throw new Error(body.message||'请求失败');}
    return body.data;
  }
  return body;
}

function esc(s){return(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function ix(name){return window.Iconsax&&Iconsax.render?Iconsax.render(name):'';}
function fmtDt(s){return s?String(s).replace('T',' ').slice(0,16):'-';}

function statusLabel(st){
  const map={
    RECORDING:'录音中',
    STARTED:'进行中',
    PAUSED:'已暂停',
    PROCESSING:'纪要生成中',
    COMPLETED:'已结束'
  };
  return map[st]||st||'未知';
}
function statusBadgeClass(st){
  if(st==='COMPLETED')return 'badge-completed';
  if(st==='RECORDING')return 'badge-recording';
  if(st==='STARTED')return 'badge-started';
  if(st==='PAUSED')return 'badge-expiring';
  if(st==='PROCESSING')return 'badge-processing';
  return 'ui-badge-neutral';
}
function statusBadge(st){
  return '<span class="ui-badge '+statusBadgeClass(st)+'">'+esc(statusLabel(st))+'</span>';
}
function vpBadge(status){
  if(status==='VALID')return '<span class="ui-badge badge-valid">声纹有效</span>';
  if(status==='EXPIRING')return '<span class="ui-badge badge-expiring">即将过期</span>';
  if(status==='EXPIRED')return '<span class="ui-badge badge-expired">已过期</span>';
  return '<span class="ui-badge ui-badge-neutral">未注册</span>';
}
function canRecover(st){
  return st==='STARTED'||st==='RECORDING'||st==='PAUSED';
}
function canEnd(st){
  return st==='STARTED'||st==='RECORDING'||st==='PAUSED';
}

let presetChromaGrid=null;
let gooeyNavInstance=null;
let activeDashboardTab='quick';

function initBlurFade(){ if(window.SmMotion) SmMotion.initBlurFade(); }

function buildNavItems(perms){
  const items=[{id:'quick',label:'快速开始'}];
  if(perms.canRegisterVoiceprint) items.push({id:'voiceprint',label:'声纹注册'});
  items.push({id:'recent',label:'近期会议'});
  items.push({id:'account',label:'账户信息'});
  return items;
}

function showDashboardPanel(tabId){
  activeDashboardTab=tabId;
  document.querySelectorAll('.dashboard-panel').forEach(panel=>{
    const panelId=panel.id.replace(/^panel-/,'');
    panel.classList.toggle('hidden',panelId!==tabId);
  });
}

function initDashboardNav(items){
  if(!window.GooeyNav||!items.length) return;
  if(gooeyNavInstance) gooeyNavInstance.unmount();
  let initialIndex=items.findIndex(item=>item.id===activeDashboardTab);
  if(initialIndex<0){
    initialIndex=0;
    activeDashboardTab=items[0].id;
  }
  gooeyNavInstance=GooeyNav.mount('#dashboard-nav',{
    items,
    initialActiveIndex:initialIndex,
    particleCount:0,
    onSelect:(index,item)=>showDashboardPanel(item.id)
  });
  showDashboardPanel(activeDashboardTab);
}

function initPresetChromaGrid(presets){
  if(!window.ChromaGrid||!presets||!presets.length) return;
  const mountEl=document.getElementById('preset-chroma-grid');
  if(!mountEl) return;
  if(presetChromaGrid) presetChromaGrid.unmount();
  const items=ChromaGrid.presetsToItems(presets);
  presetChromaGrid=ChromaGrid.mount(mountEl,{
    items,
    columns:2,
    radius:260,
    damping:0.45,
    fadeOut:0.6,
    ease:'power3.out',
    onItemClick:(item)=>{
      doCreateMeeting(parseInt(item.code,10),item.code);
    }
  });
}

function initDashboardBento(){
  if(!window.MagicBento||!window.gsap) return;
  MagicBento.enhance('#app .ui-card.card',{
    glowColor:'0, 47, 167',
    enableSpotlight:false,
    enableTilt:false,
    enableMagnetism:false,
    enableStars:false,
    clickEffect:true
  });
}

function renderActiveMeetingHtml(activeMeeting,canCreate,canEndMeeting){
  if(!activeMeeting) return '';
  if(canEndMeeting){
    return `<div class="ui-card card blur-fade">
      <div class="msg msg-info" style="margin-top:0;margin-bottom:10px">
        检测到进行中会议：<b>${esc(activeMeeting.title || activeMeeting.id)}</b> ${statusBadge(activeMeeting.status)}
      </div>
      <div class="btn-grid" style="margin-top:0">
        ${canCreate?`<button class="ui-btn ui-btn-recover btn btn-recover" id="btn-recover" style="width:100%" ${canRecover(activeMeeting.status)?'':'disabled'}>恢复当前会议</button>`:''}
        <button class="ui-btn ui-btn-danger btn btn-danger" id="btn-end-active" style="width:100%" ${canEnd(activeMeeting.status)?'':'disabled'}>结束当前会议</button>
      </div>
    </div>`;
  }
  return `<div class="ui-card card blur-fade">
    <div class="msg msg-info" style="margin-top:0;margin-bottom:0">
      进行中：<b>${esc(activeMeeting.title || activeMeeting.id)}</b> ${statusBadge(activeMeeting.status)}<br/>
      <span class="muted">您没有结束会议权限，如需操作请联系管理员。</span>
    </div>
  </div>`;
}

function renderQuickPanel(canCreate,presets,activeMeeting,canEndMeeting){
  const activeBlock=renderActiveMeetingHtml(activeMeeting,canCreate,canEndMeeting);
  const presetBlock=canCreate
    ? `<div class="ui-card card card-chroma-meetings blur-fade">
        <h2>开始会议</h2>
        <div id="preset-chroma-grid"></div>
        <p id="create-msg" class="msg hidden"></p>
      </div>`
    : `<div class="ui-card card blur-fade">
        <h2>开始会议</h2>
        <p class="muted">您没有创建会议的权限，请联系管理员。</p>
      </div>`;
  return activeBlock+presetBlock;
}

async function init(){
  try{
    const meResp=await api('/api/v1/dashboard/me');
    const me=meResp.userInfo||meResp;
    const perms=meResp.permissions||{};
    const vp=await api('/api/v1/dashboard/voiceprint-status');
    const activeMeeting=await api('/api/v1/dashboard/active-meeting');
    const meetings=await api('/api/v1/dashboard/recent-meetings?limit=10');
    const presets=await api('/api/v1/dashboard/meeting-presets');

    const canCreate=perms.canCreateMeeting;
    const canEndMeeting=perms.canEndMeeting;
    const canVoiceprint=perms.canRegisterVoiceprint;
    const navItems=buildNavItems(perms);

    const meetingList=meetings.length===0?'<p class="muted">暂无近期会议</p>':
      meetings.map(m=>`<div class="meeting-item"><span class="meeting-title">${esc(m.title)}</span>${statusBadge(m.status)}<span class="meeting-time">${fmtDt(m.createdAt)}</span>${m.docUrl?'<a class="meeting-link" href="'+esc(m.docUrl)+'" target="_blank">纪要</a>':''}</div>`).join('');

    const accountDetails=me.mappingExists
      ? '<p class="muted">OA userId: '+esc(me.oaUserId)+'</p>'
      : '<p class="muted">未关联 OA 账号</p>';

    const voiceprintPanel=canVoiceprint
      ? `<section id="panel-voiceprint" class="dashboard-panel hidden">
          <div class="ui-card card blur-fade">
            <h2>声纹注册</h2>
            <p>${vp.registered?'声纹特征 ID: '+esc(vp.featureId)+'<br/>有效期至: '+fmtDt(vp.expiresAt):'您尚未注册声纹，注册后会议纪要可自动识别您的声音。'}</p>
            <button class="ui-btn ui-btn-voice" id="btn-register">${ix('microphone')}${vp.registered?'重新注册声纹':'注册声纹'}</button>
          </div>
        </section>`
      : '';

    document.getElementById('app').innerHTML=`
      <div class="dashboard-shell">
        <div class="ui-card card dashboard-nav-card blur-fade">
          <div id="dashboard-nav"></div>
        </div>
        <div class="dashboard-panels">
          <section id="panel-quick" class="dashboard-panel">
            ${renderQuickPanel(canCreate,presets,activeMeeting,canEndMeeting)}
          </section>
          ${voiceprintPanel}
          <section id="panel-recent" class="dashboard-panel hidden">
            <div class="ui-card card blur-fade">
              <h2>近期会议</h2>
              ${meetingList}
            </div>
          </section>
          <section id="panel-account" class="dashboard-panel hidden">
            <div class="ui-card card blur-fade">
              <h2>账户信息</h2>
              <div class="user-bar"><span class="user-name">${esc(me.userName||me.feishuUserId)}</span>${vpBadge(vp.expiryStatus)}</div>
              ${accountDetails}
            </div>
            <div class="ui-card card blur-fade">
              <details class="ui-help"><summary>帮助</summary>
                <p class="muted">令牌有效期 8 小时 · 过期后请重新发送「会议管理」</p>
              </details>
            </div>
          </section>
        </div>
      </div>`;

    initDashboardNav(navItems);

    if(canCreate){
      initPresetChromaGrid(presets);
    }
    if(canVoiceprint){
      const regBtn=document.getElementById('btn-register');
      if(regBtn) regBtn.onclick=async()=>{
        try{
          const r=await api('/api/v1/dashboard/voiceprint-register-url');
          location.href=r.registerUrl;
        }catch(e){showMsg('create-msg',e.message,true);}
      };
    }
    const recoverBtn=document.getElementById('btn-recover');
    const endBtn=document.getElementById('btn-end-active');
    const setActiveButtonsDisabled=(disabled)=>{
      if(recoverBtn) recoverBtn.disabled=disabled;
      if(endBtn) endBtn.disabled=disabled;
    };
    if(recoverBtn && activeMeeting && canCreate){
      recoverBtn.onclick=async()=>{
        if(!canRecover(activeMeeting.status)) return;
        setActiveButtonsDisabled(true);
        try{
          const r=await api('/api/v1/dashboard/active-meeting/recover',{method:'POST'});
          if(r && r.recordingUrl){
            window.open(r.recordingUrl,'_blank');
          }else{
            showMsg('create-msg','当前会议暂无可用入口，请稍后重试。',true);
          }
        }catch(e){
          showMsg('create-msg',e.message,true);
        }finally{
          setActiveButtonsDisabled(false);
        }
      };
    }
    if(endBtn && activeMeeting && canEndMeeting){
      endBtn.onclick=async()=>{
        if(!canEnd(activeMeeting.status)) return;
        if(!confirm('确认结束当前会议？结束后将进入纪要处理流程。')) return;
        setActiveButtonsDisabled(true);
        try{
          await api('/api/v1/dashboard/active-meeting/end',{method:'POST'});
          showMsg('create-msg','当前会议已结束，正在生成纪要。',false);
          setTimeout(()=>init(),1200);
        }catch(e){
          showMsg('create-msg',e.message,true);
          setActiveButtonsDisabled(false);
        }
      };
    }

    initBlurFade();
    initDashboardBento();
  }catch(e){
    document.getElementById('app').innerHTML='<div class="ui-card card msg msg-err">加载失败: '+esc(e.message)+'</div>';
    initBlurFade();
    initDashboardBento();
  }
}

async function doCreateMeeting(presetCode,busyCode){
  const msgEl=document.getElementById('create-msg');
  if(!msgEl) return;
  msgEl.classList.remove('hidden');
  msgEl.className='msg msg-info';
  msgEl.textContent='正在创建会议…';
  if(presetChromaGrid) presetChromaGrid.setBusy(busyCode!=null?busyCode:presetCode,true);
  try{
    const body={presetTypeCode:presetCode};
    const r=await api('/api/v1/dashboard/create-meeting',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    msgEl.className='msg msg-ok';
    if(r && r.recordingUrl){
      msgEl.innerHTML='会议已创建！ID: '+esc(r.id)+'<br/>'
        +'<a class="meeting-link" href="'+esc(r.recordingUrl)+'" target="_blank">打开会议主页（直达）</a>'
        +'<br/><span class="muted">飞书会话中也会推送直达卡片</span>';
    }else{
      msgEl.textContent='会议已创建！ID: '+r.id;
    }
    setTimeout(()=>{msgEl.classList.add('hidden');init();},3000);
  }catch(e){
    msgEl.className='msg msg-err';
    msgEl.textContent=e.message;
    if(presetChromaGrid) presetChromaGrid.setBusy(busyCode!=null?busyCode:presetCode,false);
  }
}

function showMsg(id,text,isErr){
  const el=document.getElementById(id);
  if(!el) return;
  el.classList.remove('hidden');
  el.className=isErr?'msg msg-err':'msg msg-ok';
  el.textContent=text;
}

init();
</script>
</body>
</html>
