<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    (function(){var p=location.pathname||'';var c=(p==='/meeting-server'||p.startsWith('/meeting-server/'))?'/meeting-server':'';var b=document.createElement('base');b.href=c?c+'/':'/';document.head.appendChild(b);})();
  </script>
  <title>线上到会确认</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ui-kit/tokens.css?v=sm-ui-20260610-2">
  <link rel="stylesheet" href="ui-kit/components.css?v=sm-ui-20260610-2">
  <link rel="stylesheet" href="ui-kit/icons.css?v=sm-ui-20260610-2">
  <link rel="stylesheet" href="ui-kit/motion.css?v=sm-ui-20260610-2">
  <script src="ui-kit/icons.js?v=sm-ui-20260610-2"></script>
  <style>
    body { max-width: 480px; margin: 48px auto; padding: 0 16px; }
    h1 { font-size: 1.25rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    #status { margin-top: 24px; }
    .ok { color: var(--color-success); font-weight: 600; }
    .err { color: var(--color-danger); font-weight: 600; }
  </style>
</head>
<body>
  <h1>线上到会确认</h1>
  <p class="muted">打开本页即向会议系统登记到场，无需麦克风、不采集音频。</p>
  <div id="status" class="ui-card">正在登记…</div>
  <script src="static/meeting-context.js?v=sm-20260525-1"></script>
  <script>if(window.Iconsax){var h=document.querySelector('h1');if(h)h.insertAdjacentHTML('afterbegin',Iconsax.render('tick-circle'));}</script>
  <script>
    (function () {
      var statusEl = document.getElementById('status');
      var pathParts = location.pathname.split('/').filter(Boolean);
      var meetingId = pathParts.length >= 2 ? pathParts[pathParts.length - 1] : null;
      var token = new URLSearchParams(location.search).get('token');
      if (!meetingId || !token) {
        statusEl.innerHTML = '<span class="err">链接无效，请从飞书重新打开个人入会链接。</span>';
        return;
      }
      fetch(meetingApi('/api/v1/meetings/' + encodeURIComponent(meetingId) + '/check-in'), {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
      }).then(function (res) { return res.json().then(function (j) { return { res: res, j: j }; }); })
        .then(function (x) {
          if (!x.res.ok || x.j.code !== 0) throw new Error(x.j.message || x.res.statusText);
          var d = x.j.data || {};
          statusEl.innerHTML = '<span class="ui-badge badge-valid">已到会</span><br/><br/>' +
            (d.name ? '姓名：' + d.name + '<br/>' : '') +
            '登记时间：' + (d.checkedInAt || '') +
            '<p class="muted" style="margin-top:12px">您可以关闭本页；会议录音由现场设备负责。</p>';
        })
        .catch(function (e) {
          statusEl.innerHTML = '<span class="err">' + (e.message || '登记失败') + '</span>';
        });
    })();
  </script>
</body>
</html>
