<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智能会议</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#333;min-height:100vh}
        .container{max-width:480px;margin:0 auto;padding:16px}
        .header{text-align:center;padding:20px 0}
        .header h1{font-size:22px;margin-bottom:4px}
        .meeting-title{font-size:14px;color:#666}
        .status-card{background:#fff;border-radius:12px;padding:20px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
        .status-indicator{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
        .status-dot{width:10px;height:10px;border-radius:50%;background:#ccc}
        .status-dot.recording{background:#ff4444;animation:pulse 1s infinite}
        .status-dot.paused{background:#ff9800}
        .status-dot.reconnecting{background:#2196f3;animation:pulse .5s infinite}
        .status-dot.stopped{background:#999}
        .status-dot.error{background:#f44336}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        .status-text{font-size:16px;font-weight:500}
        .timer{font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:2px;margin:8px 0;color:#333}
        .waveform{width:100%;height:50px;margin-top:8px;border-radius:8px}
        .controls{display:flex;gap:12px;justify-content:center;margin:20px 0}
        .btn{padding:12px 24px;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s}
        .btn:disabled{opacity:.5;cursor:not-allowed}
        .btn-primary{background:#4caf50;color:#fff;flex:1;min-width:0}
        .btn-primary:hover:not(:disabled){background:#43a047}
        .btn-danger{background:#e53935;color:#fff;flex:1;min-width:0}
        .btn-danger:hover:not(:disabled){background:#c62828}
        .btn-warning{background:#ff9800;color:#fff}
        .btn-success{background:#4caf50;color:#fff}
        .btn-secondary{background:#fff;color:#333;border:2px solid #bdbdbd;flex:1;min-width:0}
        .btn-secondary:hover:not(:disabled){background:#f5f5f5}
        .transcript-section{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
        .transcript-section h2{font-size:16px;margin-bottom:12px}
        .transcript-list{max-height:300px;overflow-y:auto;font-size:14px;line-height:1.6}
        .transcript-line{padding:8px 0;border-bottom:1px solid #f0f0f0}
        .transcript-line.interim{color:#999}
        .speaker{font-weight:600;color:#1976d2}
        .time{font-size:12px;color:#999}
        .placeholder{color:#aaa;text-align:center;padding:20px}
        .notice{background:#fff3cd;color:#856404;border-radius:8px;padding:12px;margin-top:12px;font-size:13px}
        .error-banner{background:#ffebee;color:#c62828;border-radius:8px;padding:12px;margin-top:12px;font-size:13px;display:none}
        /* 事项进度通报：Markdown 渲染区 */
        .md-body{font-size:14px;line-height:1.6;color:#333;white-space:normal;word-break:break-word}
        .md-body h1{font-size:1.35rem;margin:12px 0 8px;font-weight:700}
        .md-body h2{font-size:1.2rem;margin:14px 0 8px;font-weight:700;border-bottom:1px solid #eee;padding-bottom:4px}
        .md-body h3{font-size:1.05rem;margin:10px 0 6px;font-weight:600}
        .md-body p{margin:8px 0}
        .md-body ul,.md-body ol{margin:8px 0;padding-left:1.35rem}
        .md-body li{margin:4px 0}
        .md-body hr{border:none;border-top:1px solid #e0e0e0;margin:14px 0}
        .md-body table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0;display:table}
        .md-body th,.md-body td{border:1px solid #ddd;padding:8px 6px;text-align:left;vertical-align:top}
        .md-body th{background:#f5f5f5;font-weight:600}
        .md-body tr:nth-child(even) td{background:#fafafa}
        .md-body code,.md-body pre{font-family:ui-monospace,Consolas,monospace;font-size:12px}
        .md-body pre{background:#f5f5f5;padding:10px;border-radius:8px;overflow-x:auto;margin:8px 0}
        .md-body code{background:#f0f0f0;padding:1px 5px;border-radius:4px}
        .md-body pre code{background:transparent;padding:0}
        .md-body blockquote{border-left:4px solid #1976d2;margin:8px 0;padding:4px 0 4px 12px;color:#555;background:#f9fcff}
        .md-body a{color:#1565c0}
        /* 事项进度通报标题行 + 语音播报 */
        .progress-report-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
        .progress-report-head h2{margin:0;flex:1;font-size:16px}
        .tts-btn{flex-shrink:0;width:44px;height:44px;border:none;border-radius:10px;background:#e3f2fd;color:#1565c0;font-size:20px;line-height:1;cursor:pointer;transition:background .2s,transform .15s}
        .tts-btn:hover:not(:disabled){background:#bbdefb}
        .tts-btn:active:not(:disabled){transform:scale(.96)}
        .tts-btn:disabled{opacity:.45;cursor:not-allowed}
        .tts-btn.tts-playing{background:#1565c0;color:#fff;animation:tts-pulse 1.2s ease-in-out infinite}
        @keyframes tts-pulse{0%,100%{opacity:1}50%{opacity:.72}}
        /* 会序飞书资料链接 */
        .agenda-feishu-section{margin-top:16px}
        .agenda-feishu-item{padding:12px 0;border-bottom:1px solid #f0f0f0}
        .agenda-feishu-item:last-child{border-bottom:none}
        .agenda-feishu-title{font-size:15px;font-weight:600;margin-bottom:6px}
        .agenda-feishu-link{display:block;font-size:13px;color:#1565c0;word-break:break-all;text-decoration:none;margin-top:4px}
        .agenda-feishu-link:hover{text-decoration:underline}
        .agenda-feishu-kind{display:inline-block;font-size:11px;color:#666;background:#f0f4f8;border-radius:4px;padding:2px 6px;margin-right:6px}
        .agenda-feishu-empty{color:#999;font-size:13px;padding:8px 0}
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎙️ 智能会议</h1>
            <p class="meeting-title" id="meetingTitle">加载中...</p>
        </header>

        <main class="main">
            <div class="status-card">
                <div class="status-indicator">
                    <span class="status-dot" id="statusDot"></span>
                    <span class="status-text" id="statusText">准备就绪</span>
                </div>
                <div class="timer" id="timer">00:00:00</div>
                <canvas class="waveform" id="waveform" width="400" height="50"></canvas>
            </div>

            <div class="controls" style="flex-wrap:wrap">
                <button class="btn btn-primary" id="startBtn" onclick="startRecording()">🎤 开始录音</button>
                <button class="btn btn-danger" id="endMeetingBtn" onclick="endMeetingFromWeb()">结束会议</button>
            </div>
            <div class="controls">
                <button class="btn btn-warning" id="pauseBtn" onclick="pauseRecording()" style="display:none">⏸️ 暂停</button>
                <button class="btn btn-success" id="resumeBtn" onclick="resumeRecording()" style="display:none">▶️ 继续</button>
            </div>

            <div class="transcript-section agenda-feishu-section" id="agendaFeishuSection" style="margin-top:16px">
                <h2>📎 会序飞书资料</h2>
                <p class="agenda-feishu-empty" id="agendaFeishuHint">正在加载会序资料链接…</p>
                <div id="agendaFeishuBody"></div>
            </div>

            <div class="transcript-section" id="progressReportSection" style="margin-top:16px;display:none">
                <div class="progress-report-head">
                    <h2>📊 事项进度通报（AI）</h2>
                    <button type="button" class="tts-btn" id="progressReportTtsBtn" title="语音播报" aria-label="语音播报" disabled onclick="toggleProgressReportTts()">🔊</button>
                </div>
                <div style="margin-bottom:10px">
                    <button type="button" class="btn btn-secondary" id="loadProgressReportBtn" onclick="loadMatterProgressReport()" style="width:100%;padding:10px">生成 AI 事项进度通报</button>
                </div>
                <div class="transcript-list md-body" id="progressReportBody" style="max-height:420px"></div>
            </div>

            <div class="transcript-section" id="transcriptSection" style="display:none;margin-top:16px">
                <h2>📝 实时转写</h2>
                <div class="transcript-list" id="transcriptList">
                    <p class="placeholder">转写内容将在此实时显示</p>
                </div>
            </div>

            <div class="notice" id="iosNotice" style="display:none">
                🍎 iOS提示：请保持屏幕常亮，勿切换到其他应用
            </div>
            <div class="notice">
                💡 结束会议请在上方点击「结束会议」，系统将生成纪要（飞书发「结束会议」仍为备用方式）
            </div>
            <div class="error-banner" id="errorBanner"></div>
        </main>
    </div>

    <!-- 发版改静态 JS：同步改下面 ?v= 与 static/recorder.js 内 SM_STATIC_ASSET_V -->
    <script src="/static/vendor/marked.min.js?v=sm-20260512-5"></script>
    <script src="/static/vendor/purify.min.js?v=sm-20260512-5"></script>
    <script src="/static/recorder.js?v=sm-20260512-5"></script>
    <script>
    /**
     * 智能会议录音 - 前端主逻辑 (内联版)
     */
    let recorder = null;
    let timerInterval = null;
    let startTime = null;
    let waveCtx = null;
    let analyser = null;

    // 从URL解析参数 - 支持 /recorder/{meetingId}?token=xxx 和 /recorder/?meeting_id=xxx&token=xxx
    const urlParams = new URLSearchParams(window.location.search);
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const meetingId = urlParams.get('meeting_id') || (pathParts.length >= 2 ? pathParts[pathParts.length - 1] : null);
    const token = urlParams.get('token');

    console.log('Meeting ID:', meetingId);
    console.log('Token:', token ? '***' : 'missing');

    function detectIOS() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent)
            || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    function showError(msg) {
        const banner = document.getElementById('errorBanner');
        banner.textContent = msg;
        banner.style.display = msg ? 'block' : 'none';
    }

    /** 将事项进度通报 Markdown 安全渲染为 HTML（依赖 static/vendor 下的 marked + DOMPurify） */
    function renderProgressMarkdown(el, markdown) {
        const text = markdown == null ? '' : String(markdown);
        el.className = 'transcript-list md-body';
        if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
            try {
                const rawHtml = marked.parse(text, { breaks: true, gfm: true, mangle: false, headerIds: false });
                el.innerHTML = DOMPurify.sanitize(rawHtml, { USE_PROFILES: { html: true } });
                return;
            } catch (err) {
                console.warn('Markdown render failed', err);
            }
        }
        el.textContent = text;
    }

    function setProgressReportTtsEnabled(on) {
        const btn = document.getElementById('progressReportTtsBtn');
        if (btn) btn.disabled = !on;
    }

    function stopProgressReportTts() {
        if (window.speechSynthesis) {
            try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
        }
        const btn = document.getElementById('progressReportTtsBtn');
        if (btn) btn.classList.remove('tts-playing');
    }

    function pickZhVoice() {
        const syn = window.speechSynthesis;
        if (!syn) return null;
        const voices = syn.getVoices() || [];
        return voices.find(function (v) { return v.lang && /^zh/i.test(v.lang); })
            || voices.find(function (v) { return v.lang && /CN|TW|HK/i.test(v.lang); })
            || null;
    }

    /** 语音播报事项进度（用 innerText，与 Markdown 渲染结果一致）；再点一次停止 */
    function toggleProgressReportTts() {
        const syn = window.speechSynthesis;
        if (!syn) {
            showError('当前浏览器不支持语音播报');
            return;
        }
        if (syn.speaking || syn.pending) {
            stopProgressReportTts();
            return;
        }
        const body = document.getElementById('progressReportBody');
        const text = (body && body.innerText ? body.innerText : '').replace(/\s+/g, ' ').trim();
        if (!text || text.indexOf('智能体正在生成') !== -1) {
            showError('暂无播报内容，请等待通报生成完成');
            return;
        }
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN';
        u.rate = 0.92;
        const v = pickZhVoice();
        if (v) u.voice = v;
        u.onend = function () {
            const btn = document.getElementById('progressReportTtsBtn');
            if (btn) btn.classList.remove('tts-playing');
        };
        u.onerror = u.onend;
        const btn = document.getElementById('progressReportTtsBtn');
        if (btn) btn.classList.add('tts-playing');
        syn.speak(u);
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('meetingTitle').textContent = meetingId ? `会议: ${meetingId.substring(0,12)}...` : '会议ID: 未知';

        if (detectIOS()) {
            document.getElementById('iosNotice').style.display = 'block';
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && recorder?.isRecording) {
                    showError('⚠️ 录音中，请保持屏幕常亮！');
                }
            });
        }

        if (!token || !meetingId) {
            document.getElementById('statusText').textContent = '❌ 链接无效';
            document.getElementById('startBtn').disabled = true;
            document.getElementById('endMeetingBtn').disabled = true;
            showError('录音链接无效，请从飞书机器人重新获取');
        } else {
            loadMeetingAgendaFeishuLinks();
        }

        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = function () { pickZhVoice(); };
        }

        // 初始化波形canvas
        waveCtx = document.getElementById('waveform').getContext('2d');
    });

    async function startRecording() {
        if (!token || !meetingId) {
            showError('录音链接无效，请从飞书机器人重新获取');
            return;
        }

        const startBtn = document.getElementById('startBtn');
        startBtn.disabled = true;
        startBtn.textContent = '⏳ 连接中...';

        // 构建WebSocket URL
        const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${location.host}/ws/audio/${meetingId}?token=${encodeURIComponent(token)}`;

        recorder = new MeetingRecorder(meetingId, token, wsUrl);

        recorder.onStatusChange = (status) => updateStatusUI(status);
        recorder.onTranscript = (result) => addTranscriptLine(result);
        recorder.onError = (msg) => { showError('❌ ' + msg); updateStatusUI('error'); };
        recorder.onWarning = (msg) => console.warn(msg);
        recorder.onAnalyser = (node) => { analyser = node; drawWaveform(); };

        try {
            await recorder.start();
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
            document.getElementById('pauseBtn').style.display = 'inline-block';
            document.getElementById('transcriptSection').style.display = 'block';
        } catch (e) {
            showError('录音启动失败：' + e.message);
            startBtn.disabled = false;
            startBtn.textContent = '🎤 开始录音';
        }
    }

    function pauseRecording() {
        if (recorder) recorder.pause();
        document.getElementById('pauseBtn').style.display = 'none';
        document.getElementById('resumeBtn').style.display = 'inline-block';
    }

    function resumeRecording() {
        if (recorder) recorder.resume();
        document.getElementById('resumeBtn').style.display = 'none';
        document.getElementById('pauseBtn').style.display = 'inline-block';
    }

    function isFeishuDocUrl(url) {
        var u = url != null ? String(url).trim() : '';
        if (!u) return false;
        return /\/(docx|wiki|base)\/[^/?#]+/i.test(u);
    }

    function feishuKindLabel(kind, url) {
        var k = kind != null ? String(kind).trim().toUpperCase() : '';
        if (k === 'WIKI') return '知识库';
        if (k === 'BASE') return '多维表格';
        if (k === 'DOCX') return '云文档';
        var u = url != null ? String(url) : '';
        if (/\/wiki\//i.test(u)) return '知识库';
        if (/\/base\//i.test(u)) return '多维表格';
        if (/\/docx\//i.test(u)) return '云文档';
        return '飞书资料';
    }

    function collectFeishuRefsFromAgendaItem(item) {
        var refs = [];
        var seen = {};
        function add(url, kind) {
            var u = url != null ? String(url).trim() : '';
            if (!u || !isFeishuDocUrl(u) || seen[u]) return;
            seen[u] = true;
            refs.push({ url: u, kind: kind || '' });
        }
        if (!item) return refs;
        if (item.feishuDocs && item.feishuDocs.length) {
            item.feishuDocs.forEach(function (d) {
                if (!d) return;
                add(d.url, d.kind);
            });
        }
        add(item.feishuDocUrl, item.feishuDocKind);
        return refs;
    }

    function renderAgendaFeishuLinks(items) {
        var body = document.getElementById('agendaFeishuBody');
        var hint = document.getElementById('agendaFeishuHint');
        if (!body) return;
        body.innerHTML = '';
        if (!items || !items.length) {
            if (hint) {
                hint.textContent = '暂无会序资料';
                hint.style.display = 'block';
            }
            return;
        }
        var hasAny = false;
        items.forEach(function (it, idx) {
            var refs = collectFeishuRefsFromAgendaItem(it);
            if (!refs.length) return;
            hasAny = true;
            var block = document.createElement('div');
            block.className = 'agenda-feishu-item';
            var title = document.createElement('div');
            title.className = 'agenda-feishu-title';
            title.textContent = (idx + 1) + '. ' + (it.title || ('会序 ' + (idx + 1)));
            block.appendChild(title);
            refs.forEach(function (ref) {
                var row = document.createElement('div');
                row.style.marginTop = '6px';
                var badge = document.createElement('span');
                badge.className = 'agenda-feishu-kind';
                badge.textContent = feishuKindLabel(ref.kind, ref.url);
                row.appendChild(badge);
                var link = document.createElement('a');
                link.className = 'agenda-feishu-link';
                link.href = ref.url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = ref.url;
                row.appendChild(link);
                block.appendChild(row);
            });
            body.appendChild(block);
        });
        if (hint) {
            if (hasAny) {
                hint.textContent = '本页为会议录音入口；会序资料请在飞书中打开下方链接（如「前期项目汇报」对应多维表格）。';
                hint.style.display = 'block';
            } else {
                hint.textContent = '当前会序未配置飞书资料链接';
                hint.style.display = 'block';
            }
        }
    }

    async function loadMeetingAgendaFeishuLinks() {
        if (!token || !meetingId) return;
        try {
            const res = await fetch('/api/v1/meetings/' + encodeURIComponent(meetingId), {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const j = await res.json();
            if (j.code !== 0 || !j.data) throw new Error(j.message || '加载会议失败');
            renderAgendaFeishuLinks(j.data.hostAgendaItems || []);
            var sec = document.getElementById('progressReportSection');
            if (sec) sec.style.display = 'block';
        } catch (e) {
            var hint = document.getElementById('agendaFeishuHint');
            if (hint) hint.textContent = '会序资料加载失败：' + (e.message || e);
            showError('会序资料加载失败：' + (e.message || e));
        }
    }

    async function loadMatterProgressReport() {
        if (!token || !meetingId) {
            showError('录音链接无效');
            return;
        }
        const sec = document.getElementById('progressReportSection');
        const body = document.getElementById('progressReportBody');
        if (sec) sec.style.display = 'block';
        body.className = 'transcript-list md-body';
        body.textContent = '智能体正在生成待办进度通报，请稍候…';
        setProgressReportTtsEnabled(false);
        stopProgressReportTts();
        try {
            const res = await fetch('/api/v1/meetings/' + encodeURIComponent(meetingId) + '/matter-progress-report', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const j = await res.json();
            if (j.code !== 0) throw new Error(j.message || '分析失败');
            const md = (j.data && j.data.analysisMarkdown) ? j.data.analysisMarkdown : '';
            renderProgressMarkdown(body, md);
            setProgressReportTtsEnabled(!!String(md || '').trim());
            sec.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } catch (e) {
            body.innerHTML = '';
            body.textContent = '';
            setProgressReportTtsEnabled(false);
            showError('事项进度通报失败：' + (e.message || e));
        }
    }

    async function endMeetingFromWeb() {
        if (!token || !meetingId) {
            showError('录音链接无效，无法结束会议');
            return;
        }
        if (!confirm('确定结束会议并生成纪要？未保存的录音将提交服务器处理。')) return;

        const endBtn = document.getElementById('endMeetingBtn');
        endBtn.disabled = true;

        try {
            if (recorder && recorder.ws && recorder.ws.readyState === WebSocket.OPEN) {
                recorder.ws.send(JSON.stringify({ type: 'stop' }));
                await new Promise(function (r) { setTimeout(r, 600); });
            }
            if (recorder) recorder.stop();

            const res = await fetch('/api/v1/meetings/' + encodeURIComponent(meetingId) + '/recording-session/end', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const j = await res.json();
            if (j.code !== 0) throw new Error(j.message || '结束失败');

            document.getElementById('statusText').textContent = '✅ 已结束，纪要生成中';
            document.getElementById('statusDot').className = 'status-dot stopped';
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('pauseBtn').style.display = 'none';
            document.getElementById('resumeBtn').style.display = 'none';
            if (timerInterval) clearInterval(timerInterval);
            showError('');
            const ok = document.createElement('div');
            ok.className = 'notice';
            ok.style.background = '#e8f5e9';
            ok.style.color = '#2e7d32';
            ok.textContent = '会议已结束（状态：' + (j.data && j.data.status ? j.data.status : '') + '）。可关闭页面或返回飞书查看。';
            document.querySelector('main.main').appendChild(ok);
        } catch (e) {
            showError('结束会议失败：' + (e.message || e));
            endBtn.disabled = false;
        }
    }

    function updateStatusUI(status) {
        const dot = document.getElementById('statusDot');
        const text = document.getElementById('statusText');
        const startBtn = document.getElementById('startBtn');

        const states = {
            recording: { dot: 'recording', text: '🔴 录音中' },
            paused: { dot: 'paused', text: '⏸️ 已暂停' },
            reconnecting: { dot: 'reconnecting', text: '🔄 重连中...' },
            stopped: { dot: 'stopped', text: '⏹️ 已停止' },
            error: { dot: 'error', text: '❌ 异常' },
        };

        const s = states[status] || { dot: '', text: status };
        dot.className = 'status-dot ' + s.dot;
        text.textContent = s.text;

        if (status === 'recording') {
            startBtn.style.display = 'none';
            document.getElementById('endMeetingBtn').disabled = false;
        }
    }

    function updateTimer() {
        if (!startTime) return;
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
        const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
        const s = String(elapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `${h}:${m}:${s}`;
    }

    function addTranscriptLine(result) {
        const list = document.getElementById('transcriptList');
        const placeholder = list.querySelector('.placeholder');
        if (placeholder) placeholder.remove();

        const speaker = result.speaker_id || '未知';
        const text = result.text || '';
        if (!text.trim()) return;

        const line = document.createElement('div');
        line.className = 'transcript-line' + (result.is_final ? '' : ' interim');
        const timeStr = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        line.innerHTML = `<span class="speaker">👤 ${speaker}</span> <span class="time">(${timeStr})</span><br><span class="text">${text}</span>`;
        list.appendChild(line);
        list.scrollTop = list.scrollHeight;
    }

    function drawWaveform() {
        if (!analyser || !waveCtx) return;
        requestAnimationFrame(drawWaveform);

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteTimeDomainData(dataArray);

        const canvas = document.getElementById('waveform');
        const W = canvas.width, H = canvas.height;
        waveCtx.fillStyle = '#f5f5f5';
        waveCtx.fillRect(0, 0, W, H);
        waveCtx.lineWidth = 2;
        waveCtx.strokeStyle = '#4caf50';
        waveCtx.beginPath();

        const sliceWidth = W / bufferLength;
        let x = 0;
        for (let i = 0; i < bufferLength; i++) {
            const v = dataArray[i] / 128.0;
            const y = (v * H) / 2;
            if (i === 0) waveCtx.moveTo(x, y);
            else waveCtx.lineTo(x, y);
            x += sliceWidth;
        }
        waveCtx.lineTo(W, H / 2);
        waveCtx.stroke();
    }
    </script>
</body>
</html>
