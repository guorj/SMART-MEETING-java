# =============================================================================
# Prod Profile — meeting-server 生产/准生产
# =============================================================================
# 激活：SPRING_PROFILES_ACTIVE=prod
# 与 dev 对齐：同库、同三方密钥、同 base-url；差异主要在会后开关默认值
# 业务开关 → [Admin热更] schema-seed/meeting-runtime-defaults-prod.sql + Admin
# 配置层级标签见 application.yml 文件头
#   asr.offline-enabled=true + minute.generation-enabled=true（下方）
#   → 先离线转写，再纪要生成 → COMPLETED
#
# 消息：排除 Kafka + meeting.kafka.enabled=false → LocalEventBus（与 dev 一致）
#       若上 Kafka：设 KAFKA_ENABLED=true、取消 exclude，并创建 topic
#       meeting.offline.asr / meeting.events / todo.extract
# =============================================================================
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      # 若启用 Redis 预设缓存，可取消下一行注释并配置 spring.data.redis
      # - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

  datasource:
    url: jdbc:mysql://60.205.1.17:3306/intelligence?allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&useSSL=false&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: intelligence
    password: "intelligence@2026"
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

meeting:
  kafka:
    enabled: false

  # 业务开关 → Admin + schema-seed/meeting-runtime-defaults-prod.sql
  base-url: "https://oa.qdyhjz.cn/meeting-server"

  # ----- 飞书 -----
  feishu:
    app-id: "cli_a9742c7795795bc2"
    app-secret: "yNKh96SePvhk4h3b1Z1Rnjw3RZ6fivIj"
    verification-token: "8xLRCY78R4WF2LVOyjtXJfLXePgfSYOG"
    encrypt-key: "UUL5bdPrZN6mgNroM38RRbE6rVE1m35y"
    base-url: "https://open.feishu.cn"
    token-cache-seconds: 7200
    bot-ux:
      welcome-on-bot-join: true
      welcome-text: "大家好，我是「智能会议」助手。\n请用下方快捷菜单或发送「开始会议」使用本群会议功能。"
      instruction-card-on-first-start: false
      menu-event-key-start-meeting: "start_meeting"
      menu-v6-fallback-to-last-group-chat: true
  # ----- ASR / 离线说话人（开关 → Admin；此处仅连接参数）-----
  asr:
    primary: xfyun
    fallback: tencent
    lang: "autodialect"
    role-type: 2
    eng-speaker-match: 1
    audio-encode: "pcm_s16le"
    mock-enabled: false
    xfyun:
      app-id: "e88682b8"
      api-key: "cf2d80e0d6bddb829c43d147dfc1d664"
      api-secret: "NGFmOGU1MDRjNGQ3NTQwY2NkOTZmNTBl"
      ws-url: "wss://office-api-ast-dx.iflyaisol.com/ast/communicate/v1"
      isv-url: "https://api.xf-yun.com/v1/private/s1aa729d0"
      isv-group-id: "smart_meeting_vp"
      connect-max-retries: 3
      send-max-retries: 2
      ws-handshake-timeout: 10
      receive-timeout: 30
      reconnect:
        max-retries: 5
        backoff-ms: 1000
        backoff-multiplier: 2.0
        max-backoff-ms: 30000

  # ----- ISV 声纹（enabled/threshold → Admin）-----
  isv:
    group-id: "smart_meeting_vp"
    search-min-audio-sec: 3.0
    api-timeout: 8
    register-timeout: 5.0
    debug-log: true
    ttl-years: 10

  # ----- LLM -----
  llm:
    provider: "deepseek"
    api-key: "sk-bc91279066c0419f80df68b03e0d90d8"
    api-url: "https://api.deepseek.com"
    model: "deepseek-v4-pro"
    timeout-seconds: 120
    max-retries: 2

  # ----- 录音 PCM -----
  audio:
    sample-rate: 16000
    bit-depth: 16
    channels: 1
    frame-duration-ms: 40
    max-duration-hours: 4
    silence-auto-pause-min: 30
    cache-retention-hours: 72
    cache-dir: "./data/audio"
    queue-maxsize: 100
    write-flush-interval: 25

  # ----- JWT -----
  jwt:
    secret: "IQ7vgVe5uBy0XJ6q8mzrqHgRzl9md+1oO1qKLHnxchxdUyhN2qa3aRqiCK+99U5K"
    expire-hours: 4

  # ----- 心跳 -----
  heartbeat:
    interval: 30
    frontend-ws-close-timeout: 5

openclaw:
  agent:
    provider: ${OPENCLAW_AGENT_PROVIDER:mcp}
  # Gateway 同机用 127.0.0.1；跨机须配 device-token 获 operator.write
  gateway-url: ${OPENCLAW_GATEWAY_URL:http://127.0.0.1:18789}
  device-token: ${OPENCLAW_DEVICE_TOKEN:}
  agent-session-key: ${OPENCLAW_SESSION_KEY:agent:jqclaw:direct:ou_5eadac907bd2dc79e8b39205ef6bf33a}
  auth-token: ${OPENCLAW_AUTH_TOKEN:49a4395d662298ec7c4efa2d038411ae3aceb41bd4912271}

logging:
  level:
    root: INFO
    com.smartmeeting: info
  file:
    path: "./logs/smart-meeting"
    max-size: 100MB
    max-history: 7
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_uuid
  mapper-locations: classpath*:/mapper/**/*.xml
