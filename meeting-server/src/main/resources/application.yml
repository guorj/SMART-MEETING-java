# =============================================================================
# smart-meeting-server 默认配置（全环境基线）
# =============================================================================
# 生效顺序（高 → 低）：环境变量 > application-{profile}.yml > 本文件
# 默认 profile：dev（见 spring.profiles.active，可用 SPRING_PROFILES_ACTIVE 覆盖）
#
# 会后链路（2026-06-07 解耦后）：
#   meeting.asr.offline-enabled     — 会议结束独立触发离线转写（Outbox OFFLINE_ASR）
#   meeting.minute.generation-enabled — 仅控制纪要/待办链路；与离线开关解耦
#   两者皆 true 时：先离线转写入库，再触发纪要（纪要只读 DB，不再内联调离线 ASR）
#   meeting.kafka.enabled=false 时由 LocalEventBus 异步执行（dev/prod 常用）
#   meeting.kafka.enabled=true  时需 topic：meeting.events、meeting.offline.asr、todo.extract
#
# 修改后须重启服务；@ConditionalOnProperty 组件（如 Kafka 消费者）同样需重启注册。
# =============================================================================

# -----------------------------------------------------------------------------
# HTTP 服务
# -----------------------------------------------------------------------------
server:
  # 监听端口；生产若经反代暴露，此处仍为进程本地端口
  port: ${SERVER_PORT:8765}
  servlet:
    # 上下文路径；对外 URL 一般为 {base-url} = http(s)://host:port + context-path
    context-path: ${MEETING_CONTEXT_PATH:/meeting-server}
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# -----------------------------------------------------------------------------
# Spring 框架与基础设施
# -----------------------------------------------------------------------------
spring:
  application:
    name: smart-meeting-server

  profiles:
    # 激活的配置文件后缀：dev / prod 等
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      # 声纹注册等上传接口的单文件/整请求大小上限
      max-file-size: ${MEETING_VOICEPRINT_MAX_FILE_SIZE:10MB}
      max-request-size: ${MEETING_VOICEPRINT_MAX_REQUEST_SIZE:10MB}

  datasource:
    # MySQL 主库（会议、转写、纪要、Outbox 等）；字符集 utf8mb4
    url: jdbc:mysql://${DB_HOST:60.205.1.17}:${DB_PORT:3306}/intelligence?allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&useSSL=false&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:intelligence}
    password: ${DB_PASSWORD:intelligence@2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000

  data:
    redis:
      # 会务预设缓存、主持会话状态等；不可用时部分能力降级
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 10
      timeout: 5000ms

  sql:
    init:
      # 禁止应用启动时自动执行 schema-data.sql（避免覆盖库内飞书 URL 等种子数据）
      mode: never
      encoding: UTF-8

  kafka:
    # 仅 meeting.kafka.enabled=true 时生效；dev/prod profile 通常排除 KafkaAutoConfiguration
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      retries: 3
      acks: all
    consumer:
      group-id: smart-meeting
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      concurrency: 3
      ack-mode: manual

  web:
    resources:
      # 静态页：录音页 /rec、主持页 /host、工作台等，打包在 classpath:/static/
      static-locations: classpath:/static/

# =============================================================================
# 业务配置 meeting.*（默认值；各 profile 可覆盖）
# =============================================================================
meeting:

  # ----- 流水线（会前 PRE / 会后 POST）-----
  pipeline:
    # 建会成功后是否立即跑 PRE 流水线（压测或本地调试可关，避免批量飞书通知）
    pre-on-create-enabled: ${MEETING_PIPELINE_PRE_ON_CREATE_ENABLED:true}
    post-auto-trigger:
      # 会议结束后是否自动触发 POST 流水线（与纪要生成独立，走 Pipeline 模板）
      enabled: ${MEETING_PIPELINE_POST_AUTO_TRIGGER_ENABLED:true}
      # 为空：按 stage=POST 的默认启用模板；非空：指定 templateCode
      template-code: ${MEETING_PIPELINE_POST_TEMPLATE_CODE:}

  # ----- 会前定时调度 -----
  scheduler:
    # PRE 自动触发总开关（会前 24h / 10min 双时点）
    pre-enabled: ${MEETING_SCHEDULER_PRE_ENABLED:true}
    # 触发容忍窗口（分钟），补偿定时扫描周期误差
    pre-window-minutes: ${MEETING_SCHEDULER_PRE_WINDOW_MINUTES:5}
    # 会前 24h 使用的 PRE 模板编码（空=不触发该时点）
    pre-24h-template-code: ${MEETING_SCHEDULER_PRE_24H_TEMPLATE_CODE:}
    # 会前 10min 使用的 PRE 模板编码（空=不触发该时点）
    pre-10m-template-code: ${MEETING_SCHEDULER_PRE_10M_TEMPLATE_CODE:}
    # 调度扫描周期（毫秒）
    scan-ms: ${MEETING_SCHEDULER_SCAN_MS:300000}

  database:
    # 启动时只读校验会序飞书种子（不写库）；关闭：MEETING_DB_VALIDATE_SEED=false
    validate-seed-on-startup: ${MEETING_DB_VALIDATE_SEED:true}

  # ----- 会后纪要链路（与离线 ASR 解耦）-----
  minute:
    # 会后是否生成纪要主链路（MeetingEndedEvent → MINUTE_GENERATE）
    # false：不自动纪要；不影响 offline-enabled 触发的离线转写
    generation-enabled: ${MEETING_MINUTE_GENERATION_ENABLED:false}
    # 是否将纪要正文写入 int_meeting_minute（与飞书 doc_url 可双写）
    persist-enabled: ${MEETING_MINUTE_PERSIST:true}
    # GET 纪要 API 是否返回全文（false 仅元信息）
    expose-content-in-api: ${MEETING_MINUTE_EXPOSE_API:true}
    # 是否调用 LLM 生成结构化初稿；false 时用转写拼接简易纪要
    llm-enabled: ${MEETING_MINUTE_LLM_ENABLED:true}
    # LLM 初稿后是否 AI 增强（OpenClaw / 直调 LLM）
    ai-enhancement-enabled: ${MEETING_MINUTE_AI_ENHANCEMENT:true}
    # 是否创建/更新飞书文档
    feishu-doc-enabled: ${MEETING_MINUTE_FEISHU_DOC_ENABLED:true}
    # 纪要完成后是否推送飞书卡片/文本
    notify-enabled: ${MEETING_MINUTE_NOTIFY_ENABLED:true}

  # ----- 会后待办 -----
  todo:
    # 纪要完成后是否提取待办（MinuteGeneratedEvent → TODO_EXTRACT）
    extraction-enabled: ${MEETING_TODO_EXTRACTION_ENABLED:false}
    # 待办到期提醒 Cron 任务总开关（false 不注册 TodoReminderScheduler）
    reminder-enabled: ${MEETING_TODO_REMINDER_ENABLED:false}

  notification:
    # 会后部分通知经 feishu-scheduled-bot POST /api/push
    bot-enabled: ${MEETING_NOTIFY_BOT:false}
    bot-base-url: ${MEETING_NOTIFY_BOT_URL:http://127.0.0.1:8764}
    scheduled-bot-apikey: ${SCHEDULED_BOT_APIKEY:jq_int_meeting_key}
    # bot 不可用时是否回退直连飞书 API
    fallback-direct: ${MEETING_NOTIFY_FALLBACK:true}

  # ----- 异步消息（Kafka / LocalEventBus）-----
  kafka:
    # false：单进程 LocalEventBus（offline-asr + minute-generate + todo-extract）
    # true ：KafkaProducer + MinuteGenerateConsumer + OfflineAsrConsumer + TodoExtractConsumer
    enabled: ${KAFKA_ENABLED:false}

  # 对外根 URL（飞书卡片链接、JWT 跳转、录音/主持页入口），须与浏览器实际访问一致
  base-url: ${BASE_URL:http://localhost:8765/meeting-server}

  web:
    # /static/** 浏览器缓存秒数；发版后若壳页旧可减小或设置 page-cache-buster
    static-cache-seconds: ${MEETING_STATIC_CACHE_SECONDS:300}
    # 非空时拼到 /rec、/host URL 的 &v= 参数，强制刷新前端缓存
    page-cache-buster: ${MEETING_PAGE_CACHE_BUSTER:}

  # ----- 会序本地上传资料（与 meeting-admin-server 共用目录）-----
  agenda-material:
    # 本地上传 doc/图片落盘目录；admin 上传、runtime 下载须同路径
    storage-dir: ${AGENDA_MATERIAL_DIR:./data/agenda-materials}
    max-image-bytes: ${AGENDA_MATERIAL_MAX_IMAGE_BYTES:10485760}
    max-doc-bytes: ${AGENDA_MATERIAL_MAX_DOC_BYTES:20971520}

  # ----- 会议录音 PCM 缓存 -----
  audio:
    sample-rate: 16000
    bit-depth: 16
    channels: 1
    frame-duration-ms: 40
    max-duration-hours: 4
    # 会中长时间静音自动暂停录音（分钟）
    silence-auto-pause-min: 30
    cache-retention-hours: 72
    # 单场 PCM 默认路径：{cache-dir}/{meetingId}.pcm，并写入 int_meeting.audio_path
    cache-dir: ./data/audio
    # 仅有云端 source_audio_url 时，是否下载到本地供离线 ASR 使用
    cloud-download-enabled: ${MEETING_AUDIO_CLOUD_DOWNLOAD_ENABLED:true}
    queue-maxsize: 100
    write-flush-interval: 25

  # ----- 语音识别 ASR -----
  asr:
    primary: xfyun
    fallback: tencent
    lang: autodialect
    role-type: 2
    eng-speaker-match: 1
    audio-encode: pcm_s16le
    # 会中实时转写（WebSocket → 讯飞实时 ASR → int_transcript_segment isFinal=true）
    # false：会中仅录 PCM，无实时字幕
    realtime-enabled: ${MEETING_ASR_REALTIME_ENABLED:false}
    # 会后离线转写（独立触发，不依赖 generation-enabled）
    # true + 无实时定稿分段 + 有音频 → 会议结束发布 OfflineAsrRequestedEvent
    # 结果写入 int_transcript_segment；纪要开启时在离线完成后才触发
    offline-enabled: ${MEETING_ASR_OFFLINE_ENABLED:true}
    # 离线 IST 上传是否开启说话人分离（roleType=1）
    offline-role-enabled: ${MEETING_ASR_OFFLINE_ROLE_ENABLED:true}
    # true：跳过真实讯飞调用（本地联调）
    mock-enabled: ${MOCK_ASR:false}
    xfyun:
      app-id: ${XFYUN_APP_ID:test}
      api-key: ${XFYUN_API_KEY:test}
      api-secret: ${XFYUN_API_SECRET:test}
      ws-url: wss://office-api-ast-dx.iflyaisol.com/ast/communicate/v1
      isv-url: https://api.xf-yun.com/v1/private/s1aa729d0
      isv-group-id: ${ISV_GROUP_ID:smart_meeting_vp}
      connect-max-retries: 3
      send-max-retries: 2
      ws-handshake-timeout: 10
      receive-timeout: 30
      # WebSocket 握手后额外等待（毫秒）；首帧异常时可调大，默认 0 降低首字延迟
      post-open-wait-ms: ${XFYUN_POST_OPEN_WAIT_MS:0}
      reconnect:
        max-retries: 5
        backoff-ms: 1000
        backoff-multiplier: 2.0
        max-backoff-ms: 30000

  # ----- 离线转写后的声纹说话人标注 -----
  voiceprint:
    offline-label-enabled: ${MEETING_VOICEPRINT_OFFLINE_LABEL:true}
    offline-min-slice-ms: ${MEETING_VOICEPRINT_OFFLINE_MIN_SLICE_MS:3000}
    offline-max-slice-ms: ${MEETING_VOICEPRINT_OFFLINE_MAX_SLICE_MS:10000}
    offline-max-speakers: ${MEETING_VOICEPRINT_OFFLINE_MAX_SPEAKERS:8}

  # ----- 主持页 TTS（讯飞在线合成，鉴权复用 asr.xfyun）-----
  tts:
    ws-url: ${XFYUN_TTS_WS_URL:wss://tts-api.xfyun.cn/v2/tts}
    vcn: ${XFYUN_TTS_VCN:x4_yezi}
    connect-timeout-sec: 15
    read-timeout-sec: ${XFYUN_TTS_READ_TIMEOUT_SEC:120}
    # 单段 UTF-8 原文上限（讯飞 base64 包 <8000 字节）
    max-text-utf8-bytes: ${XFYUN_TTS_MAX_TEXT_UTF8_BYTES:5300}

  # ----- Redis 会务预设缓存 -----
  cache:
    preset-ttl-hours: ${MEETING_CACHE_PRESET_TTL_HOURS:24}
    refresh-enabled: ${MEETING_CACHE_REFRESH_ENABLED:true}
    refresh-cron: ${MEETING_CACHE_REFRESH_CRON:0 */10 * * * ?}

  # ----- 内部运维 API（刷新预设、主持会序等）-----
  internal:
    reload-enabled: ${MEETING_INTERNAL_RELOAD_ENABLED:true}
    reload-token: ${INTERNAL_RELOAD_TOKEN:dev-internal-reload}

  # ----- AI 主持（Web 主持页，会中零飞书群消息）-----
  host:
    enabled: ${MEETING_HOST_ENABLED:true}
    agenda-enabled: ${MEETING_HOST_AGENDA_ENABLED:true}
    tts-enabled: ${MEETING_HOST_TTS_ENABLED:true}
    roll-call-enabled: ${MEETING_HOST_ROLL_CALL_ENABLED:true}
    auto-roll-call-after-opening: ${MEETING_HOST_AUTO_ROLL_CALL_AFTER_OPENING:true}
    reminder:
      topic-minutes-left: 1
      meeting-minutes-left: "10,3"
    roll-call:
      online-inventory-seconds: ${MEETING_HOST_ROLL_CALL_ONLINE_INVENTORY_SEC:60}
      window-seconds: ${MEETING_HOST_ROLL_CALL_WINDOW_SEC:12}
      asr-grace-seconds: ${MEETING_HOST_ROLL_CALL_ASR_GRACE_SEC:6}

  # ----- 讯飞 ISV 声纹 1:N -----
  isv:
    enabled: ${ISV_ENABLED:false}
    group-id: ${ISV_GROUP_ID:smart_meeting_vp}
    match-score-threshold: 0.2
    search-min-audio-sec: 3.0
    api-timeout: 8
    register-timeout: 5.0
    debug-log: ${ISV_DEBUG_LOG:false}
    ttl-years: 10

  # ----- 大模型（纪要初稿、待办提取等）-----
  llm:
    provider: ${LLM_PROVIDER:deepseek}
    api-key: ${LLM_API_KEY:test}
    api-url: ${LLM_API_BASE:https://api.deepseek.com/v1/chat/completions}
    model: ${LLM_MODEL:deepseek-v4-pro}
    timeout-seconds: 120
    max-retries: 2

  # ----- 飞书开放平台 -----
  feishu:
    app-id: ${FEISHU_APP_ID:test}
    app-secret: ${FEISHU_APP_SECRET:test}
    verification-token: ${FEISHU_VERIFICATION_TOKEN:}
    encrypt-key: ${FEISHU_ENCRYPT_KEY:}
    base-url: https://open.feishu.cn
    token-cache-seconds: 7200
    bot-ux:
      welcome-on-bot-join: true
      instruction-card-on-first-start: false
      menu-event-key-start-meeting: start_meeting
      menu-v6-fallback-to-last-group-chat: true

  jwt:
    secret: ${JWT_SECRET:this-is-…mum-key-change-in-production}
    expire-hours: 4
    feishu-web-entry-expire-minutes: ${FEISHU_WEB_ENTRY_EXPIRE_MINUTES:30}
    feishu-web-dashboard-expire-hours: ${FEISHU_WEB_DASHBOARD_EXPIRE_HOURS:8}

  heartbeat:
    interval: ${HEARTBEAT_INTERVAL:30}
    frontend-ws-close-timeout: ${FRONTEND_WS_CLOSE_TIMEOUT:5}

# =============================================================================
# OpenClaw AI Agent（纪要增强、会前分析等；provider=llm 或 mcp）
# =============================================================================
openclaw:
  enabled: ${OPENCLAW_ENABLED:true}
  agent:
    provider: ${OPENCLAW_AGENT_PROVIDER:mcp}
  gateway-url: ${OPENCLAW_GATEWAY_URL:http://127.0.0.1:18792}
  agent-session-key: ${OPENCLAW_SESSION_KEY:agent:jqclaw:direct:ou_5eadac907bd2dc79e8b39205ef6bf33a}
  timeout-seconds: ${OPENCLAW_TIMEOUT:60}
  auth-token: ${OPENCLAW_AUTH_TOKEN:}
  device-token: ${OPENCLAW_DEVICE_TOKEN:}
  skill-mode: ${OPENCLAW_SKILL_MODE:true}

# -----------------------------------------------------------------------------
# 日志
# -----------------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.smartmeeting: info
  file:
    path: ./logs/smart-meeting
    max-size: 100MB
    max-history: ${LOG_RETENTION_DAYS:7}
