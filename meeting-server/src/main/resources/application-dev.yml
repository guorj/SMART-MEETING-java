# =============================================================================
# Dev Profile — meeting-server 开发环境
# =============================================================================
# 激活：spring.profiles.active=dev（默认）或 SPRING_PROFILES_ACTIVE=dev
# 启动：mvn spring-boot:run -pl meeting-server
# 覆盖关系：本文件覆盖 application.yml 同名键；环境变量仍可覆盖本文件
#
# 本环境典型会后组合（继承 application.yml 默认值，除非下方显式覆盖）：
#   asr.offline-enabled=true（默认） + minute.generation-enabled=false（下方）
#   → 会议结束后：PROCESSING → 离线转写入 int_transcript_segment → COMPLETED
#   不自动跑纪要/待办；适合本地验证录音与离线 ASR
#
# 消息中间件：排除 Kafka 自动配置 + meeting.kafka.enabled=false → LocalEventBus
# =============================================================================

spring:
  autoconfigure:
    exclude:
      # 开发机通常无 Kafka；会后异步走 LocalEventBus（offline-asr / minute-generate）
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  datasource:
    # 与 prod 共用远程 intelligence 库（开发联调）；生产部署请用独立库或只读账号
    url: jdbc:mysql://60.205.1.17:3306/intelligence?allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&useSSL=false&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: intelligence
    password: "intelligence@2026"
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      # 禁止启动执行 schema-data.sql，防止覆盖库内飞书文档 URL
      mode: never

  data:
    redis:
      # 预设缓存、主持会话；与 meeting-server 同机或远程 Redis
      host: 60.205.1.17
      port: 6379
      password: jq@2026
      database: 10
      timeout: 5000ms

# =============================================================================
# 业务覆盖 meeting.*
# =============================================================================
meeting:
  recording:
    # dev 关闭录音超时自动结束，避免误杀短测会议（生产默认开启）
    timeout-check-enabled: false

  kafka:
    # false：单进程 LocalEventBus，无需创建 Kafka topic
    enabled: false

  pipeline:
    # dev 建会常关 PRE，避免每次建会触发会前飞书流水线
    pre-on-create-enabled: false
    post-auto-trigger:
      # 会议结束后仍可走 POST 流水线（与纪要/离线独立）
      enabled: true
      template-code: ""

  scheduler:
    pre-enabled: true
    scan-ms: 60000
    pre-window-minutes: 5
    pre-24h-template-code: "pre_24h_default"
    pre-10m-template-code: "pre_10m_default"

  minute:
    # dev 默认不自动纪要；要测完整链路可设 MEETING_MINUTE_GENERATION_ENABLED=true
    # 或仅开离线：保持 false + offline-enabled=true（默认）
    generation-enabled: ${MEETING_MINUTE_GENERATION_ENABLED:false}

  todo:
    extraction-enabled: ${MEETING_TODO_EXTRACTION_ENABLED:false}
    reminder-enabled: ${MEETING_TODO_REMINDER_ENABLED:false}

  # 公网入口（frp/反代）；飞书回调、卡片链接、JWT 跳转须与此一致
  base-url: "https://oa.qdyhjz.cn/meeting-server"

  feishu:
    # 测试飞书（备用，当前注释）
#    app-id: "cli_a955948fda78dbc2"
#    app-secret: "su4Ld0hCNI7tJwRlWpVWnNBxfILBlftt"
#    verification-token: "Jo9UaHKiRrSZxfekG9N1ohgXWa0HTbwX"
#    encrypt-key: "X86ftqCd6Rs3my4tOd3OweBthHypk1yS"
#    base-url: "https://open.feishu.cn"
#    token-cache-seconds: 7200
    # jq 飞书应用（当前启用）
    app-id: "cli_a9742c7795795bc2"
    app-secret: "yNKh96SePvhk4h3b1Z1Rnjw3RZ6fivIj"
    verification-token: "8xLRCY78R4WF2LVOyjtXJfLXePgfSYOG"
    encrypt-key: "UUL5bdPrZN6mgNroM38RRbE6rVE1m35y"
    base-url: "https://open.feishu.cn"
    token-cache-seconds: 7200
    # 开放平台需订阅：im.chat.member.bot.added_v1、application.bot.menu_v6 等
    # 会议类型入口为 Web（base-url/start-meeting.html?token=…）
    bot-ux:
      welcome-on-bot-join: true
      welcome-text: "大家好，我是「智能会议」助手。\n请用下方快捷菜单或发送「开始会议」使用本群会议功能。"
      instruction-card-on-first-start: false
      menu-event-key-start-meeting: "start_meeting"
      menu-v6-fallback-to-last-group-chat: true

  asr:
    # realtime-enabled 继承 application.yml 默认 false
    # offline-enabled 继承默认 true → dev 结束后自动离线转写
    primary: xfyun
    fallback: tencent
    lang: "autodialect"
    role-type: 2
    eng-speaker-match: 1
    audio-encode: "pcm_s16le"
    mock-enabled: false
    xfyun:
      app-id: "e88682b8"
      api-key: "cf2d80e0d6bddb829c43d147dfc1d664"
      api-secret: "NGFmOGU1MDRjNGQ3NTQwY2NkOTZmNTBl"
