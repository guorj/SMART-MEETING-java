# ============================================================
# Dev Profile — 开发环境完整配置（替代 .env）
# ============================================================
# 启动方式: mvn spring-boot:run -pl meeting-server
# 无需 source .env，所有参数已在此文件中
# ============================================================

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  datasource:
    url: jdbc:mysql://60.205.1.17:3306/intelligence?allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&useSSL=false&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: intelligence
    password: "intelligence@2026"
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      # 禁止启动时执行 schema-data.sql，避免覆盖库内飞书 URL（校验见 DatabaseSeedStartupValidator）
      mode: never

  data:
    redis:
      host: 60.205.1.17
      port: 6379
      password: jq@2026
      database: 10
      timeout: 5000ms
# ============================================================
# 业务配置 — 所有参数从 .env 迁移至此
# ============================================================
meeting:
  kafka:
    enabled: false
  # ===== Pipeline 触发器（dev 推荐）=====
  pipeline:
    # 本地测试可改为 false：建会后跳过 PRE 流水线（不发会前通知）
    pre-on-create-enabled: false
    post-auto-trigger:
      # 会议结束后自动触发 POST Pipeline
      enabled: true
      # 为空时按 stage=POST 默认启用模板执行；如需固定模板可填具体 templateCode
      template-code: ""
  scheduler:
    # 会前自动触发 PRE
    pre-enabled: true
    # 调度扫描周期（毫秒）
    scan-ms: 60000
    # 触发窗口（分钟）
    pre-window-minutes: 5
    # 推荐：PRE 分成两套模板，分别在会前 24h 与 10min 触发
    # 未配置时会回退到旧逻辑：24h 单次触发默认 PRE 模板
    pre-24h-template-code: "pre_24h_default"
    pre-10m-template-code: "pre_10m_default"

  minute:
    # 会后是否生成纪要（false 时结束会议不触发 minute-generate / todo-extract）
    generation-enabled: ${MEETING_MINUTE_GENERATION_ENABLED:false}

  todo:
    # 会后是否提取并同步待办（false 时跳过 TODO 提取、待办通知、待办状态推进）
    extraction-enabled: ${MEETING_TODO_EXTRACTION_ENABLED:false}
    # 待办到期提醒定时任务总开关（false 时不注册 TodoReminderScheduler）
    reminder-enabled: ${MEETING_TODO_REMINDER_ENABLED:false}

  # 公网入口：WSL frpc (tcp) → Windows 本机 8765；需与飞书/浏览器实际访问一致（无 TLS 反代时用 http + 端口）
  base-url: "https://oa.qdyhjz.cn/meeting-server"

  # ---- 飞书开放平台 ----
  feishu:
  # 测试飞书
#    app-id: "cli_a955948fda78dbc2"
#    app-secret: "su4Ld0hCNI7tJwRlWpVWnNBxfILBlftt"
