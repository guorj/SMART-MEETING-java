# ============================================================
# Dev Profile — 开发环境完整配置（替代 .env）
# ============================================================
# 启动方式: mvn spring-boot:run -pl meeting-server
# 无需 source .env，所有参数已在此文件中
# ============================================================

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

  datasource:
    url: jdbc:mysql://60.205.1.17:3306/intelligence?allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&useSSL=false&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: intelligence
    password: "intelligence@2026"
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      # 禁止启动时执行 schema-data.sql，避免覆盖库内飞书 URL（校验见 DatabaseSeedStartupValidator）
      mode: never

  data:
    redis:
      host: 60.205.1.17
      port: 6379
      password: jq@2026
      database: 10
      timeout: 5000ms
# ============================================================
# 业务配置 — 所有参数从 .env 迁移至此
# ============================================================
meeting:
  kafka:
    enabled: false

  # 公网入口：WSL frpc (tcp) → Windows 本机 8765；需与飞书/浏览器实际访问一致（无 TLS 反代时用 http + 端口）
  base-url: "https://39.97.61.212"

  # ---- 事项进度通报（本地测试允许classpath回退）----
  matter-progress:
    allow-classpath-fallback: true

  # ---- 飞书开放平台 ----
  feishu:
#    app-id: "cli_a96266a59238dbc8"
#    app-secret: "su4Ld0hCNI7tJwRlWpVWnNBxfILBlftt"
#    verification-token: "Jo9UaHKiRrSZxfekG9N1ohgXWa0HTbwX"
#    encrypt-key: "X86ftqCd6Rs3my4tOd3OweBthHypk1yS"
#    base-url: "https://open.feishu.cn"
#    token-cache-seconds: 7200
    #jq飞书
    app-id: "cli_a9742c7795795bc2"
    app-secret: "yNKh96SePvhk4h3b1Z1Rnjw3RZ6fivIj"
    verification-token: "8xLRCY78R4WF2LVOyjtXJfLXePgfSYOG"
    encrypt-key: "UUL5bdPrZN6mgNroM38RRbE6rVE1m35y"
    base-url: "https://open.feishu.cn"
    token-cache-seconds: 7200
    # 欢迎语与菜单：开放平台 → 事件订阅 im.chat.member.bot.added_v1、application.bot.menu_v6、
    #   im.chat.access_event.bot_p2p_chat_entered_v1（用户进入与机器人单聊，便于私聊内点菜单无 chat_id 时回退）
    # 会议类型入口为 Web（meeting.base-url/start-meeting.html?token=…）；卡片回传仅兼容旧消息，可不订阅 card.action.trigger
    # 快捷菜单建议选「向当前会话发送消息」填「开始会议」；若用「推送 event_key」须与 menu-event-key-start-meeting 一致
    bot-ux:
      welcome-on-bot-join: true
      welcome-text: "大家好，我是「智能会议」助手。\n请用下方快捷菜单或发送「开始会议」使用本群会议功能。"
      instruction-card-on-first-start: false
      menu-event-key-start-meeting: "start_meeting"
      menu-v6-fallback-to-last-group-chat: true

  # ---- 科大讯飞 ASR ----
  asr:
    primary: xfyun
    fallback: tencent
    lang: "autodialect"
    role-type: 2
    eng-speaker-match: 1
    audio-encode: "pcm_s16le"
    mock-enabled: false
    xfyun:
      app-id: "e88682b8"
      api-key: "cf2d80e0d6bddb829c43d147dfc1d664"
      api-secret: "NGFmOGU1MDRjNGQ3NTQwY2NkOTZmNTBl"
      ws-url: "wss://office-api-ast-dx.iflyaisol.com/ast/communicate/v1"
      isv-url: "https://api.xf-yun.com/v1/private/s1aa729d0"
      isv-group-id: "smart_meeting_vp"
      connect-max-retries: 3
      send-max-retries: 2
      ws-handshake-timeout: 10
      receive-timeout: 30
      reconnect:
        max-retries: 5
        backoff-ms: 1000
        backoff-multiplier: 2.0
        max-backoff-ms: 30000

  # ---- 讯飞 ISV 声纹 ----
  isv:
    enabled: true
    group-id: "smart_meeting_vp"
    match-score-threshold: 0.2
    search-min-audio-sec: 3.0
    api-timeout: 8
    register-timeout: 5.0
    debug-log: true
    ttl-years: 10

  # ---- 大模型 ----
  llm:
    provider: "deepseek"
    api-key: "sk-bc91279066c0419f80df68b03e0d90d8"
    api-url: "https://api.deepseek.com"
    model: "deepseek-v4-pro"
    timeout-seconds: 120
    max-retries: 2

  # ---- 音频 ----
  audio:
    sample-rate: 16000
    bit-depth: 16
    channels: 1
    frame-duration-ms: 40
    max-duration-hours: 4
    silence-auto-pause-min: 30
    cache-retention-hours: 72
    cache-dir: "./data/audio"
    queue-maxsize: 100
    write-flush-interval: 25

  # ---- JWT ----
  jwt:
    secret: "IQ7vgVe5uBy0XJ6q8mzrqHgRzl9md+1oO1qKLHnxchxdUyhN2qa3aRqiCK+99U5K"
    expire-hours: 4

  # ---- 心跳/超时 ----
  heartbeat:
    interval: 30
    frontend-ws-close-timeout: 5

# ============================================================
# AI Agent 配置（策略模式：openclaw / llm）
# ============================================================
openclaw:
  enabled: ${OPENCLAW_ENABLED:false}
  agent:
    provider: ${OPENCLAW_AGENT_PROVIDER:llm}
  gateway-url: ${OPENCLAW_GATEWAY_URL:http://127.0.0.1:18792}
  agent-session-key: ${OPENCLAW_SESSION_KEY:agent:jqclaw:direct:ou_5eadac907bd2dc79e8b39205ef6bf33a}
  timeout-seconds: ${OPENCLAW_TIMEOUT:60}
  auth-token: ${OPENCLAW_AUTH_TOKEN:}
  cli:
    agent-name: ${OPENCLAW_CLI_AGENT_NAME:JQClaw}
    profile: ${OPENCLAW_CLI_PROFILE:clone-boss}
    state-dir: ${OPENCLAW_CLI_STATE_DIR:}

# ---- 日志 ----
logging:
  level:
    root: INFO
    com.smartmeeting: info
  file:
    path: "./logs/smart-meeting"
    max-size: 100MB
    max-history: 7

# ---- MyBatis-Plus ----
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_uuid
  mapper-locations: classpath*:/mapper/**/*.xml
