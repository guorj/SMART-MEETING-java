# =============================================================================
# Dev Profile — meeting-server 开发环境
# =============================================================================
# 激活：spring.profiles.active=dev（默认）或 SPRING_PROFILES_ACTIVE=dev
# 启动：mvn spring-boot:run -pl meeting-server
# 覆盖关系：本文件覆盖 application.yml 同名键；环境变量仍可覆盖本文件
#
# 业务开关：[Admin热更] → int_meeting_system_config（Java 出厂默认 + DB 覆盖）
# 下方 dev-only 块为 [冷启动] 例外；reload 后以 DB 或 Java 出厂为准（见 Loader）
#
# 配置层级标签见 application.yml 文件头：[Admin热更] / [冷启动] / [部署/密钥]
#
# 消息中间件：排除 Kafka 自动配置 + meeting.kafka.enabled=false → LocalEventBus
# =============================================================================
spring:
  autoconfigure:
    exclude:
      # 开发机通常无 Kafka；会后异步走 LocalEventBus（offline-asr / minute-generate）
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  datasource:
    # 与 prod 共用远程 intelligence 库（开发联调）；生产部署请用独立库或只读账号
    url: jdbc:mysql://60.205.1.17:3306/intelligence?allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&useSSL=false&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: intelligence
    password: "intelligence@2026"
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      # 禁止启动执行 schema-data.sql，防止覆盖库内飞书文档 URL
      mode: never

  data:
    redis:
      # 预设缓存、主持会话；与 meeting-server 同机或远程 Redis
      host: 60.205.1.17
      port: 6379
      password: jq@2026
      database: 10
      timeout: 5000ms

# =============================================================================
# meeting.* — infra / 密钥 + dev-only 冷启动例外
# =============================================================================
meeting:
  recording:
    # [冷启动] dev 关闭录音超时自动结束，避免误杀短测会议（生产默认 true）
    timeout-check-enabled: false

  kafka:
    # [冷启动]
    enabled: false

  # dev-only [冷启动] 例外（业务开关见 [Admin热更] seed / Admin）
  pipeline:
    pre-on-create-enabled: false
    post-auto-trigger:
      enabled: true
      template-code: ""

  scheduler:
    pre-enabled: true
    pre-24h-template-code: "pre_24h_default"
    pre-10m-template-code: "pre_10m_default"
    # [冷启动] meeting.scheduler.scan-ms
    scan-ms: 60000

  isv:
    enabled: true
    match-score-threshold: 0.2
    group-id: "smart_meeting_vp"
    search-min-audio-sec: 3.0
    api-timeout: 8
    register-timeout: 5.0
    debug-log: true
    ttl-years: 10

  base-url: "https://oa.qdyhjz.cn/meeting-server"

  feishu:
    app-id: "cli_a9742c7795795bc2"
    app-secret: "yNKh96SePvhk4h3b1Z1Rnjw3RZ6fivIj"
    verification-token: "8xLRCY78R4WF2LVOyjtXJfLXePgfSYOG"
    encrypt-key: "UUL5bdPrZN6mgNroM38RRbE6rVE1m35y"
    base-url: "https://open.feishu.cn"
    token-cache-seconds: 7200
    bot-ux:
      welcome-on-bot-join: true
      welcome-text: "大家好，我是「智能会议」助手。\n请用下方快捷菜单或发送「开始会议」使用本群会议功能。"
      instruction-card-on-first-start: false
      menu-event-key-start-meeting: "start_meeting"
      menu-v6-fallback-to-last-group-chat: true

  asr:
    primary: xfyun
    fallback: tencent
    lang: "autodialect"
    role-type: 2
    eng-speaker-match: 1
    audio-encode: "pcm_s16le"
    mock-enabled: false
    xfyun:
      app-id: "e88682b8"
