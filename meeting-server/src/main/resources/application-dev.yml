# ============================================================
# AI Agent 配置（策略模式：llm / mcp）
# ============================================================
openclaw:
  enabled: ${OPENCLAW_ENABLED:true}
  agent:
    provider: ${OPENCLAW_AGENT_PROVIDER:mcp}
  gateway-url: ${OPENCLAW_GATEWAY_URL:http://127.0.0.1:18789}
  agent-session-key: ${OPENCLAW_SESSION_KEY:agent:jqclaw:direct:ou_5eadac907bd2dc79e8b39205ef6bf33a}
  timeout-seconds: ${OPENCLAW_TIMEOUT:120}
  auth-token: ${OPENCLAW_AUTH_TOKEN:bc6e1fc38ed4d2be39556be74ce349ea376354f455089e20}
  device-token: ${OPENCLAW_DEVICE_TOKEN:}
  skill-mode: ${OPENCLAW_SKILL_MODE:true}

# ---- 日志 ----
logging:
  level:
    root: INFO
    com.smartmeeting: info
  file:
    path: "./logs/smart-meeting"
    max-size: 100MB
    max-history: 7

# ---- MyBatis-Plus ----
mybatis-plus:
  configuration:
    # 勿用 StdOutImpl：会把每条 SQL 打到控制台（主持 tick 每秒 push 时刷屏）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_uuid
  mapper-locations: classpath*:/mapper/**/*.xml
