logging:
  level:
    root: INFO
    com.smartmeeting: info
  file:
    path: "./logs/smart-meeting"
    max-size: 100MB
    max-history: 7
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_uuid
  mapper-locations: classpath*:/mapper/**/*.xml
