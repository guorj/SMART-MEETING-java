# 与 application-dev.yml 叠加使用（@ActiveProfiles({"dev", "test"})，test 在后覆盖）
# 此处只保留「跑集成测试」所需增量，其余飞书/讯飞/LLM/JWT 等沿用 dev 真实配置
#
# 数据源：由 BaseTest 的 @DynamicPropertySource 注册（默认 Testcontainers MySQL，或见 BaseTest 类注释中的外部 JDBC）。
# 切勿在「开发用 intelligence 库」上跑集成测试；旧版 BaseTest 曾在 @BeforeEach 全表 delete，已移除。

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql,classpath:schema-patch-preset.sql,classpath:schema-patch-matter-progress.sql,classpath:schema-patch-host-agenda.sql,classpath:schema-patch-host-agenda-template.sql

meeting:
  kafka:
    enabled: false
  audio:
    cache-dir: ./test-data/audio
  matter-progress:
    allow-classpath-fallback: true

# ============================================================
# OpenClaw AI Agent 配置（测试环境可禁用）
# ============================================================
openclaw:
  enabled: false  # 测试环境默认禁用AI调用
  gateway-url: ${OPENCLAW_GATEWAY_URL:http://127.0.0.1:18792}
  # sessionKey 格式：agent:{agentId}:{mode}:{userId}
  agent-session-key: ${OPENCLAW_SESSION_KEY:agent:jqclaw:direct:ou_5eadac907bd2dc79e8b39205ef6bf33a}
  timeout-seconds: ${OPENCLAW_TIMEOUT:60}
  auth-token: ${OPENCLAW_AUTH_TOKEN:}
