# =============================================================================
# smart-meeting-java 本地/演示用 Docker Compose
# =============================================================================
# 启动：docker compose up -d（需在项目根准备 .env：DB_*、密钥等）
#
# 服务：meeting-server + MySQL + Redis + Kafka
# 注意：
#   - 默认 .env 若 KAFKA_ENABLED=true，须预创建 topic：
#     meeting.events、meeting.offline.asr、todo.extract
#   - 若 KAFKA_ENABLED=false（dev/prod profile 常见），Kafka 容器可不必启动
#   - 健康检查路径须与 server.servlet.context-path 一致（默认 /meeting-server）
# =============================================================================

version: "3.8"

services:
  # ----- 主应用 meeting-server -----
  smart-meeting:
    build:
      context: ./meeting-server
      dockerfile: Dockerfile
    container_name: smart-meeting-bot
    restart: unless-stopped
    ports:
      - "8765:8765"
    env_file:
      - .env
    environment:
      # 容器内服务发现主机名（覆盖 application.yml 中的 localhost 默认值）
      - KAFKA_SERVERS=kafka:9092
      - REDIS_HOST=redis
      - DB_HOST=mysql
    volumes:
      # 持久化 PCM、会序资料、日志等（须在应用内配置指向 /data 子路径）
      - meeting-data:/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      # 若 context-path=/meeting-server，健康检查 URL 需带前缀
      test: ["CMD", "curl", "-f", "http://localhost:8765/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1G

  # ----- MySQL 8 -----
  mysql:
    image: mysql:8.0
    container_name: smart-meeting-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./meeting-server/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./meeting-server/src/main/resources/schema-data.sql:/docker-entrypoint-initdb.d/02-schema-data.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----- Redis 7（预设缓存、主持会话）-----
  redis:
    image: redis:7-alpine
    container_name: smart-meeting-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----- Kafka 3.7（可选；meeting.kafka.enabled=true 时使用）-----
  kafka:
    image: apache/kafka:3.7.0
    container_name: smart-meeting-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  meeting-data:
  mysql-data:
  redis-data:
  kafka-data:
